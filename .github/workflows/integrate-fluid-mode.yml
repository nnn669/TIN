name: Integrate fluid mode
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create clean integration branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main feat/chat-fluid-background
          git checkout -B release/fluid-mode origin/main
          git checkout origin/feat/chat-fluid-background -- lib/features/home/widgets/chat_fluid_background.dart lib/features/home/widgets/chat_fluid_motion_controller.dart lib/features/settings/pages/settings_page.dart
          git add lib/features/home/widgets/chat_fluid_background.dart lib/features/home/widgets/chat_fluid_motion_controller.dart lib/features/settings/pages/settings_page.dart
          git commit -m 'feat(chat): add persistent fluid background mode'
          git push --force origin release/fluid-mode