name: Repair world book removal
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Transform sources
        shell: python
        run: |
          from pathlib import Path
          import re

          def remove_function(src, marker):
              start = src.index(marker)
              brace = src.index('{', start)
              depth = 0
              i = brace
              quote = None
              escape = False
              while i < len(src):
                  c = src[i]
                  if quote:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == quote:
                          quote = None
                  elif c in "'\"":
                      quote = c
                  elif c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          while end < len(src) and src[end] in ' \t': end += 1
                          if end < len(src) and src[end] == '\n': end += 1
                          return src[:start] + src[end:]
                  i += 1
              raise RuntimeError(marker)

          p = Path('lib/core/services/app_control/app_control_service.dart')
          s = p.read_text()
          for line in [
              "import '../../models/world_book.dart';\n",
              "import '../../providers/world_book_provider.dart';\n",
              "  static const String worldBook = 'world_book';\n",
              "  static const String addEntry = 'add_entry';\n",
              "  static const String updateEntry = 'update_entry';\n",
              "  static const String deleteEntry = 'delete_entry';\n",
              "- `world_book`: create, update, delete, activate/deactivate, import/export books, and add/update/delete entries.\n",
          ]:
              s = s.replace(line, '')
          s = s.replace('skills, world books, quick phrases', 'skills, quick phrases')
          s = s.replace(', instruction injection, or world book.', ', or instruction injection.')
          s = s.replace('Whether to activate the created instruction injection or world book for the current assistant.', 'Whether to activate the created instruction injection for the current assistant.')
          s = s.replace('Trigger keywords for skills or world book entries.', 'Trigger keywords for skills.')
          s = s.replace('Optional enabled flag for updated skills, books, entries, or servers.', 'Optional enabled flag for updated skills or servers.')
          for prop in ['entry_id', 'book_id']:
              s = re.sub(r"            '"+prop+r"': \{.*?            \},\n", '', s, flags=re.S)
          s = re.sub(r"    \{\n      'target': AppControlTargets\.worldBook,.*?    \},\n(?=    \{\n      'target': AppControlTargets\.mcpServer)", '', s, flags=re.S)
          s = re.sub(r"      AppControlTargets\.worldBook => await _executeWorldBook\(.*?      \),\n", '', s, flags=re.S)
          s = re.sub(r"      case AppControlTargets\.worldBook:.*?(?=      case AppControlTargets\.mcpServer:)", '', s, flags=re.S)
          s = re.sub(r"      AppControlTargets\.worldBook => await _worldBookSnapshot\(assistant\),\n", '', s)
          s = re.sub(r"        operation == AppControlOperations\.deleteEntry \|\|\n", '', s)
          s = re.sub(r"      AppControlTargets\.worldBook => 'AI Imported World Book',\n", '', s)
          s = re.sub(r"      'world_books': await _worldBookSnapshot\(assistant\),\n", '', s)
          s = re.sub(r"    if \(bundle\['world_books'\] is Map\) \{.*?    \}\n(?=    if \(bundle\['mcp_servers'\])", '', s, flags=re.S)
          for marker in [
              '  Future<String> _executeWorldBook(',
              '  WorldBook _patchWorldBook(',
              '  WorldBookEntry _worldBookEntryFromArgs(',
              '  WorldBookEntry _patchWorldBookEntry(',
              '  Future<Map<String, dynamic>> _worldBookSnapshot(',
              '  Future<void> _restoreWorldBooks(',
          ]:
              if marker in s: s = remove_function(s, marker)
          s = re.sub(r"  String _bookIdArg\(Map<String, dynamic> args\) \{.*?  \}\n\n", '', s, flags=re.S)
          p.write_text(s)

          p = Path('lib/features/home/widgets/chat_input_bar.dart')
          s = p.read_text()
          for line in [
              '    this.onOpenWorldBook,\n',
              '    this.worldBookActive = false,\n',
              '  final VoidCallback? onOpenWorldBook;\n',
              '  final bool worldBookActive;\n',
          ]:
              s = s.replace(line, '')
          s = re.sub(r"        if \(widget\.onOpenWorldBook != null\) \{.*?(?=        if \(widget\.onClearContext != null\) \{)", '', s, flags=re.S)
          p.write_text(s)

          import zipfile, base64
          with zipfile.ZipFile('repair-output.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.write('lib/core/services/app_control/app_control_service.dart', 'app_control_service.dart')
              z.write('lib/features/home/widgets/chat_input_bar.dart', 'chat_input_bar.dart')
          Path('repair-output.b64').write_text(base64.b64encode(Path('repair-output.zip').read_bytes()).decode())
      - name: Commit transformed output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/core/services/app_control/app_control_service.dart lib/features/home/widgets/chat_input_bar.dart repair-output.b64
          git commit -m "repair: remove world book references" || exit 0
          git push
