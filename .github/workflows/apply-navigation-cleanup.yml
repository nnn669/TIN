name: Apply navigation cleanup

'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-navigation-cleanup.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove obsolete entries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('lib/features/home/widgets/side_drawer.dart')
          s = p.read_text().replace("import '../../translate/pages/translate_page.dart';\n", '')
          p.write_text(s)
          p = Path('lib/features/settings/pages/settings_page.dart')
          s = p.read_text().replace("import '../../stats/pages/stats_page.dart';\n", '')
          s, n = re.subn(r"\n              _iosDivider\(context\),\n              _iosNavRow\(\n                context,\n                icon: Lucide\.ChartColumnBig,\n                label: l10n\.settingsPageStatistics,\n                onTap: \(\) \{.*?builder: \(_\) => const StatsPage\(\)\)\);\n                \},\n              \),", '', s, count=1, flags=re.S)
          assert n == 1
          p.write_text(s)
          p = Path('lib/desktop/desktop_settings_page.dart')
          s = p.read_text().replace("import 'setting/stats_pane.dart';\n", '').replace('  stats,\n', '')
          s, n1 = re.subn(r"\n                        case _SettingsMenuItem\.stats:\n                          return const DesktopStatsPane\(key: ValueKey\('stats'\)\);", '', s, count=1)
          s, n2 = re.subn(r"\n      \(\n        _SettingsMenuItem\.stats,\n        lucide\.Lucide\.ChartColumnBig,\n        l10n\.settingsPageStatistics,\n      \),", '', s, count=1)
          assert n1 == n2 == 1
          p.write_text(s)
          PY
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/home/widgets/side_drawer.dart lib/features/settings/pages/settings_page.dart lib/desktop/desktop_settings_page.dart
          git commit -m "feat: move statistics out of settings"
          git push origin main