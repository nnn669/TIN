name: Fix analyzer errors
on:
  push:
    branches:
      - remove-world-book
    paths:
      - 'tools/fix_analyze_errors.py'
      - '.github/workflows/wb-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fix script
        run: python3 tools/fix_analyze_errors.py
      - name: Show diff
        run: git --no-pager diff --stat
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "fix: resolve analyzer errors after world book removal"
          git push
