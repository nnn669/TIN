name: Remove World Book
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - name: Remove world book subsystem and references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tool/remove_world_book.py');s=p.read_text(encoding='utf-8')
          s=s.replace('return "".join(line for line in text.splitlines(True) if "world_book" not in line.lower())','return "".join(line for line in text.splitlines(True) if not (line.lstrip().startswith("import ") and "world_book" in line.lower()))')
          old='''token = "if (bundle['world_books'] is Map)"
          if token in s:
              s = remove_braced(s, s.find(token))'''
          new='''s = re.sub(r"(?ms)\\n    if \\(bundle\\['world_books'\\] is Map\\) \\{\\n      await _restoreWorldBooks\\(\\n        \\(bundle\\['world_books'\\] as Map\\)\\.cast<String, dynamic>\\(\\),\\n      \\);\\n    \\}", "", s)'''
          if old in s:s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          python tool/remove_world_book.py
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/core/services/app_control/app_control_service.dart');s=p.read_text()
          s=s.replace('Whether to activate the created instruction injection or world book for the current assistant.','Whether to activate the created instruction injection for the current assistant.')
          s=s.replace('Trigger keywords for skills or world book entries.','Trigger keywords for skills.')
          p.write_text(s)
          p=Path('lib/features/home/services/message_builder_service.dart');s=p.read_text();s=s.replace('  /// Inject world book (lorebook) entries into apiMessages.\n','');p.write_text(s)
          PY
          rm -f .github/workflows/finalize-world-book-removal-v2.yml .github/workflows/finalize-world-book-removal.yml .github/workflows/remove-world-book-stage.yml .github/workflows/remove-world-book-v2.yml .github/workflows/world-book-diagnostics.yml
      - name: Regenerate localization and format
        run: |
          flutter pub get
          flutter gen-l10n
          dart format lib test
      - name: Verify no world book references remain
        run: |
          if git grep -inE 'world.?book|世界书' -- ':!PROGRESS.md' ':!.github/workflows/remove-world-book.yml' ':!tool/remove_world_book.py'; then exit 1; fi
      - name: Analyze
        run: flutter analyze
      - name: Commit removal
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f tool/remove_world_book.py .github/workflows/remove-world-book.yml
          git add -A
          git commit -m "feat: remove world book feature completely"
          git push origin main