name: Remove World Book
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - name: Remove world book subsystem and references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tool/remove_world_book.py')
          s = p.read_text(encoding='utf-8')
          old = '''token = "if (bundle['world_books'] is Map)"
          if token in s:
              s = remove_braced(s, s.find(token))'''
          new = '''s = re.sub(r"(?ms)\\n    if \\(bundle\\['world_books'\\] is Map\\) \\{\\n      await _restoreWorldBooks\\(\\n        \\(bundle\\['world_books'\\] as Map\\)\\.cast<String, dynamic>\\(\\),\\n      \\);\\n    \\}", "", s)'''
          if old not in s:
              raise SystemExit('Expected legacy bundle cleanup block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          python tool/remove_world_book.py
      - name: Regenerate localization and format
        run: |
          flutter pub get
          flutter gen-l10n
          dart format lib test
      - name: Verify no world book references remain
        run: |
          if git grep -inE 'world.?book|世界书' -- ':!PROGRESS.md' ':!.github/workflows/remove-world-book.yml' ':!tool/remove_world_book.py'; then
            echo 'World book references remain' >&2
            exit 1
          fi
      - name: Analyze
        run: flutter analyze
      - name: Commit removal
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f tool/remove_world_book.py .github/workflows/remove-world-book.yml
          git add -A
          git commit -m "feat: remove world book feature completely"
          git push origin main