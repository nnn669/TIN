name: Remove World Book
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - name: Remove world book subsystem and references
        run: python tool/remove_world_book.py
      - name: Regenerate localization and format
        run: |
          flutter pub get
          flutter gen-l10n
          dart format lib test
      - name: Verify no world book references remain
        run: |
          if git grep -inE 'world.?book|世界书' -- ':!PROGRESS.md' ':!.github/workflows/remove-world-book.yml' ':!tool/remove_world_book.py'; then
            echo 'World book references remain' >&2
            exit 1
          fi
      - name: Analyze
        run: flutter analyze
      - name: Commit removal
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f tool/remove_world_book.py .github/workflows/remove-world-book.yml
          git add -A
          git commit -m "feat: remove world book feature completely"
          git push origin main