name: Remove World Book
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - name: Remove world book subsystem and references
        shell: python
        run: |
          from pathlib import Path
          import re, shutil

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def drop_imports(text):
              return ''.join(line for line in text.splitlines(True) if 'world_book' not in line.lower())
          def remove_braced(text, token, include_trailing_comma=False):
              start = text.find(token)
              if start < 0: return text
              line_start = text.rfind('\n', 0, start) + 1
              brace = text.find('{', start)
              if brace < 0: return text
              depth = 0; quote = None; escape = False
              for i in range(brace, len(text)):
                  c = text[i]
                  if quote:
                      if escape: escape = False
                      elif c == '\\': escape = True
                      elif c == quote: quote = None
                      continue
                  if c in "'\"": quote = c; continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          if include_trailing_comma and end < len(text) and text[end] == ',': end += 1
                          if end < len(text) and text[end] == '\r': end += 1
                          if end < len(text) and text[end] == '\n': end += 1
                          return text[:line_start] + text[end:]
              return text
          def remove_function(text, name):
              while True:
                  m = re.search(r'(?m)^\s*(?:Future<[^>]+>|Future<void>|void|Widget|String|bool|List<[^>]+>|Map<[^>]+>)\s+' + re.escape(name) + r'\s*\(', text)
                  if not m: return text
                  text = remove_braced(text, m.group(0).strip())
          def remove_case(text, label, next_label):
              pattern = r'(?ms)^\s*case\s+' + re.escape(label) + r'\s*:.*?(?=^\s*case\s+' + re.escape(next_label) + r'\s*:)'
              return re.sub(pattern, '', text)

          deleted = [
            'lib/core/models/world_book.dart',
            'lib/core/providers/world_book_provider.dart',
            'lib/core/services/world_book_store.dart',
            'lib/desktop/world_book_popover.dart',
            'lib/desktop/setting/world_book_pane.dart',
            'lib/features/home/widgets/world_book_sheet.dart',
            'lib/features/world_book',
          ]
          for item in deleted:
              p=Path(item)
              if p.is_dir(): shutil.rmtree(p)
              elif p.exists(): p.unlink()

          p='lib/main.dart'; s=drop_imports(read(p)); s=s.replace('        ChangeNotifierProvider(create: (_) => WorldBookProvider()),\n',''); write(p,s)

          p='lib/features/settings/pages/settings_page.dart'; s=drop_imports(read(p));
          s=re.sub(r"(?ms)\s*_iosDivider\(context\),\n\s*_iosNavRow\(\n\s*context,\n\s*icon: Lucide\.BookOpen,\n\s*label: l10n\.settingsPageWorldBook,\n\s*onTap: \(\) \{.*?\n\s*\},\n\s*\),",'',s); write(p,s)

          p='lib/desktop/desktop_settings_page.dart'; s=drop_imports(read(p));
          s=s.replace('  worldBook,\n','')
          s=re.sub(r"(?ms)\s*case _SettingsMenuItem\.worldBook:\n\s*return const DesktopWorldBookPane\(.*?\n\s*\);",'',s)
          s=re.sub(r"(?ms)\s*\(\n\s*_SettingsMenuItem\.worldBook,\n\s*lucide\.Lucide\.BookOpen,\n\s*l10n\.settingsPageWorldBook,\n\s*\),",'',s); write(p,s)

          p='lib/features/home/services/message_generation_service.dart'; s=read(p)
          s=re.sub(r"\n\s*await messageBuilderService\.injectWorldBookPrompts\(\n\s*apiMessages,\n\s*assistantId,\n\s*\);",'',s); write(p,s)

          p='lib/features/home/services/message_builder_service.dart'; s=drop_imports(read(p)); s=remove_function(s,'injectWorldBookPrompts'); write(p,s)

          p='lib/features/home/pages/home_page.dart'; s=drop_imports(read(p));
          s=s.replace('      context.read<WorldBookProvider>().initialize();\n','')
          s=remove_function(s,'_openWorldBook')
          s=re.sub(r'(?m)^\s*onOpenWorldBook:.*\n','',s); write(p,s)

          p='lib/features/chat/widgets/bottom_tools_sheet.dart'; s=drop_imports(read(p));
          s=re.sub(r"(?ms)\n\s*@override\n\s*void initState\(\) \{\n\s*super\.initState\(\);\n\s*WidgetsBinding\.instance\.addPostFrameCallback\(\(_\) async \{\n\s*if \(!mounted\) return;\n\s*await context\.read<WorldBookProvider>\(\)\.initialize\(\);\n\s*\}\);\n\s*\}",'',s)
          s=re.sub(r'(?m)^\s*final worldBookProvider =.*\n','',s); s=re.sub(r'(?m)^\s*final hasWorldBooks =.*\n','',s)
          s=re.sub(r"(?ms)\n\s*if \(hasWorldBooks\) \.\.\.\[.*?\n\s*\],",'',s); write(p,s)

          p='lib/features/home/widgets/chat_input_section.dart'; s=drop_imports(read(p));
          s=re.sub(r'(?m)^\s*this\.onOpenWorldBook,\n','',s); s=re.sub(r'(?m)^\s*final VoidCallback\? onOpenWorldBook;\n','',s)
          s=re.sub(r'(?ms)\n\s*final hasWorldBooks =\n\s*isTablet && context\.watch<WorldBookProvider>\(\)\.books\.isNotEmpty;','',s)
          s=re.sub(r'(?m)^\s*onOpenWorldBook:.*\n','',s)
          s=re.sub(r'(?ms)\n\s*worldBookActive: isTablet\n\s*\? context\n\s*\.watch<WorldBookProvider>\(\)\n\s*\.activeBookIdsFor\(assistantId\)\n\s*\.isNotEmpty\n\s*: false,','',s); write(p,s)

          p='lib/features/home/widgets/chat_input_bar.dart'; s=read(p)
          for pat in [r'(?m)^\s*this\.onOpenWorldBook,\n',r'(?m)^\s*this\.worldBookActive = false,\n',r'(?m)^\s*final VoidCallback\? onOpenWorldBook;\n',r'(?m)^\s*final bool worldBookActive;\n']:
              s=re.sub(pat,'',s)
          s=re.sub(r'(?ms)\n\s*if \(widget\.onOpenWorldBook != null\).*?(?=\n\s*(?:if \(|return |final |Widget |children:|\]))','',s)
          s=re.sub(r'(?ms)\n\s*_buildActionButton\([^)]*worldBook[^;]*;','',s,flags=re.I); write(p,s)

          p='lib/core/models/app_control_policy.dart'; s=read(p)
          s=re.sub(r'(?m)^\s*static const String worldBook =.*\n','',s); s=re.sub(r'(?m)^\s*worldBook,\n','',s); write(p,s)

          p='lib/features/assistant/pages/assistant_settings_edit_basic_tab.dart'; s=read(p)
          s=re.sub(r"(?ms)\n\s*_AppControlCapabilityMeta\(\n\s*target: AppControlPolicy\.worldBook,.*?\n\s*\),",'',s); write(p,s)

          p='lib/core/services/app_control/app_control_service.dart'; s=drop_imports(read(p))
          s=re.sub(r'(?m)^\s*static const String worldBook =.*\n','',s)
          s='\n'.join(line for line in s.split('\n') if '`world_book`' not in line and 'world books' not in line.lower() and 'world book.' not in line.lower())
          s=remove_braced(s,"{'target': AppControlTargets.worldBook",True)
          s=re.sub(r"(?ms)\n\s*\{\n\s*'target': AppControlTargets\.worldBook,.*?\n\s*\},",'',s)
          s=re.sub(r'(?m)^\s*AppControlTargets\.worldBook => await _executeWorldBook\(.*?\n','',s)
          s=remove_case(s,'AppControlTargets.worldBook','AppControlTargets.mcpServer')
          s=remove_function(s,'_executeWorldBook')
          s=re.sub(r'(?m)^.*AppControlTargets\.worldBook.*\n','',s)
          s=re.sub(r"(?ms)\n\s*'entry_id': \{.*?\n\s*\},",'',s)
          s=re.sub(r"(?ms)\n\s*'book_id': \{.*?\n\s*\},",'',s)
          write(p,s)

          p='test/core/services/app_control_service_test.dart'; s=drop_imports(read(p))
          start=s.find("  testWidgets('神经权能网关 edits world book entries")
          if start>=0:
              end=s.find("  testWidgets('神经权能网关 records audit log'",start)
              if end>=0: s=s[:start]+s[end:]
          s=re.sub(r"\n\s*ChangeNotifierProvider<WorldBookProvider>\(\n\s*create: \(_\) => WorldBookProvider\(\),\n\s*\),",'',s); write(p,s)

          # Remove stale localization keys and generated getters/methods whose names identify only this feature.
          for pth in Path('lib/l10n').glob('*'):
              if not pth.is_file(): continue
              s=pth.read_text(encoding='utf-8')
              if pth.suffix=='.arb':
                  lines=s.splitlines(True); lines=[x for x in lines if 'worldBook' not in x]
                  s=''.join(lines); s=re.sub(r',\s*\n\}', '\n}', s)
              else:
                  s=re.sub(r'(?ms)^\s*///.*?\n\s*String get \w*[Ww]orldBook\w*.*?(?=^\s*///|^\s*@override|^\})','',s)
                  s=re.sub(r'(?m)^.*[Ww]orldBook.*\n','',s)
              pth.write_text(s,encoding='utf-8')

          progress='''TASK: 删除世界书功能及全部引用代码\nSTEP: 已实现，准备发布\nDONE: 已移除移动端和桌面端设置中的世界书入口；删除世界书模型、存储、Provider、管理页面、弹窗和聊天选择器；移除消息构建中的世界书提示注入；清理神经权能网关中的世界书能力与测试引用；保留其它聊天、指令注入、技能、记忆及设置功能。\nNEXT: 更新补丁版本并创建 Release。'''
          write('PROGRESS.md',progress)
      - name: Regenerate localization and format
        run: |
          flutter pub get
          flutter gen-l10n
          dart format lib test
      - name: Verify no world book references remain
        run: |
          if git grep -inE 'world.?book|世界书' -- ':!PROGRESS.md' ':!.github/workflows/remove-world-book.yml'; then
            echo 'World book references remain' >&2
            exit 1
          fi
      - name: Analyze
        run: flutter analyze
      - name: Commit removal
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: remove world book feature completely"
          git push origin main