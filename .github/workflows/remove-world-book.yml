name: Remove World Book
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - name: Remove world book subsystem and references
        shell: python
        run: |
          from pathlib import Path
          import json, re, shutil

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def drop_imports(text): return ''.join(x for x in text.splitlines(True) if 'world_book' not in x.lower())
          def remove_braced_from(text,start,include_comma=False):
              line_start=text.rfind('\n',0,start)+1; brace=text.find('{',start)
              if brace<0: return text
              depth=0; quote=None; escape=False
              for i in range(brace,len(text)):
                  c=text[i]
                  if quote:
                      if escape: escape=False
                      elif c=='\\': escape=True
                      elif c==quote: quote=None
                      continue
                  if c in "'\"": quote=c
                  elif c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:
                          end=i+1
                          if include_comma:
                              while end<len(text) and text[end] in ' \t': end+=1
                              if end<len(text) and text[end]==',': end+=1
                          if end<len(text) and text[end]=='\r': end+=1
                          if end<len(text) and text[end]=='\n': end+=1
                          return text[:line_start]+text[end:]
              raise RuntimeError('Unbalanced block')
          def remove_function(text,name):
              while True:
                  m=re.search(r'(?m)^\s*(?:Future(?:<[^\n]+>)?|void|Widget|String|bool|List<[^\n]+>|Map<[^\n]+>|WorldBook(?:Entry)?)\s+'+re.escape(name)+r'\s*\(',text)
                  if not m: return text
                  text=remove_braced_from(text,m.start())
          def remove_block(text,token,include_comma=False):
              while token in text: text=remove_braced_from(text,text.find(token),include_comma)
              return text

          for item in ['lib/core/models/world_book.dart','lib/core/providers/world_book_provider.dart','lib/core/services/world_book_store.dart','lib/desktop/world_book_popover.dart','lib/desktop/setting/world_book_pane.dart','lib/features/home/widgets/world_book_sheet.dart','lib/features/world_book']:
              p=Path(item)
              if p.is_dir(): shutil.rmtree(p)
              elif p.exists(): p.unlink()

          p='lib/main.dart'; s=drop_imports(read(p)); s=re.sub(r'(?m)^\s*ChangeNotifierProvider\(create: \(_\) => WorldBookProvider\(\)\),\s*\n','',s); write(p,s)
          p='lib/features/settings/pages/settings_page.dart'; s=drop_imports(read(p)); s=re.sub(r'(?ms)\s*_iosNavRow\(\s*context,\s*icon: Lucide\.BookOpen,\s*label: l10n\.settingsPageWorldBook,\s*onTap: \(\) \{.*?\s*\},\s*\),\s*_iosDivider\(context\),','',s); write(p,s)
          p='lib/desktop/desktop_settings_page.dart'; s=drop_imports(read(p)); s=re.sub(r'(?m)^\s*worldBook,\s*\n','',s); s=re.sub(r'(?ms)\s*case _SettingsMenuItem\.worldBook:\s*return const DesktopWorldBookPane\(.*?\);','',s); s=re.sub(r'(?ms)\s*\(\s*_SettingsMenuItem\.worldBook,\s*lucide\.Lucide\.BookOpen,\s*l10n\.settingsPageWorldBook,\s*\),','',s); write(p,s)
          p='lib/features/home/services/message_generation_service.dart'; s=read(p); s=re.sub(r'(?ms)\n\s*await messageBuilderService\.injectWorldBookPrompts\(\s*apiMessages,\s*assistantId,\s*\);','',s); write(p,s)
          p='lib/features/home/services/message_builder_service.dart'; s=drop_imports(read(p)); s=remove_function(s,'injectWorldBookPrompts'); write(p,s)
          p='lib/features/home/pages/home_page.dart'; s=drop_imports(read(p)); s=re.sub(r'(?m)^\s*context\.read<WorldBookProvider>\(\)\.initialize\(\);\s*\n','',s)
          for name in ['_openWorldBook','_openWorldBookPopover']: s=remove_function(s,name)
          s=re.sub(r'(?m)^\s*onOpenWorldBook:.*\n','',s); write(p,s)
          p='lib/features/chat/widgets/bottom_tools_sheet.dart'; s=drop_imports(read(p)); s=re.sub(r'(?ms)\n\s*@override\s*void initState\(\) \{\s*super\.initState\(\);\s*WidgetsBinding\.instance\.addPostFrameCallback\(\(_\) async \{\s*if \(!mounted\) return;\s*await context\.read<WorldBookProvider>\(\)\.initialize\(\);\s*\}\);\s*\}','',s); s=re.sub(r'(?m)^\s*final worldBookProvider =.*\n','',s); s=re.sub(r'(?m)^\s*final hasWorldBooks =.*\n','',s); s=re.sub(r'(?ms)\n\s*if \(hasWorldBooks\) \.\.\.\[.*?\n\s*\],','',s); write(p,s)
          p='lib/features/home/widgets/chat_input_section.dart'; s=drop_imports(read(p))
          for pat in [r'(?m)^\s*this\.onOpenWorldBook,\n',r'(?m)^\s*final VoidCallback\? onOpenWorldBook;\n',r'(?m)^\s*onOpenWorldBook:.*\n']: s=re.sub(pat,'',s)
          s=re.sub(r'(?ms)\n\s*final hasWorldBooks =\s*isTablet && context\.watch<WorldBookProvider>\(\)\.books\.isNotEmpty;','',s); s=re.sub(r'(?ms)\n\s*worldBookActive: isTablet\s*\? context\s*\.watch<WorldBookProvider>\(\)\s*\.activeBookIdsFor\(assistantId\)\s*\.isNotEmpty\s*: false,','',s); write(p,s)
          p='lib/features/home/widgets/chat_input_bar.dart'; s=read(p)
          for pat in [r'(?m)^\s*this\.onOpenWorldBook,\n',r'(?m)^\s*this\.worldBookActive = false,\n',r'(?m)^\s*final VoidCallback\? onOpenWorldBook;\n',r'(?m)^\s*final bool worldBookActive;\n']: s=re.sub(pat,'',s)
          s=re.sub(r'(?ms)\n\s*if \(widget\.onOpenWorldBook != null\) \{.*?\n\s*\}','',s); write(p,s)
          p='lib/core/models/app_control_policy.dart'; s=read(p); s=re.sub(r'(?m)^\s*static const String worldBook =.*\n','',s); s=re.sub(r'(?m)^\s*worldBook,\s*\n','',s); write(p,s)
          p='lib/features/assistant/pages/assistant_settings_edit_basic_tab.dart'; s=read(p); s=re.sub(r'(?ms)\n\s*_AppControlCapabilityMeta\(\s*target: AppControlPolicy\.worldBook,.*?\s*\),','',s); write(p,s)

          p='lib/core/services/app_control/app_control_service.dart'; s=drop_imports(read(p)); s=re.sub(r'(?m)^\s*static const String worldBook =.*\n','',s)
          s=s.replace('- `world_book`: create, update, delete, activate/deactivate, import/export books, and add/update/delete entries.\n','')
          s=s.replace('containing assistant settings, skills, world books, quick phrases','containing assistant settings, skills, quick phrases')
          s=s.replace('memory, instruction injection, or world book.','memory or instruction injection.')
          s=remove_block(s,"{'target': AppControlTargets.worldBook",True)
          s=remove_block(s,"'target': AppControlTargets.worldBook",True)
          s=re.sub(r'(?ms)\n\s*AppControlTargets\.worldBook => await _executeWorldBook\(.*?\n\s*\),','',s)
          s=re.sub(r'(?ms)^\s*case AppControlTargets\.worldBook:.*?(?=^\s*case AppControlTargets\.mcpServer:)','',s)
          for name in ['_executeWorldBook','_patchWorldBook','_worldBookEntryFromArgs','_patchWorldBookEntry','_worldBookSnapshot','_restoreWorldBooks','_bookIdArg']: s=remove_function(s,name)
          s=re.sub(r'(?m)^\s*AppControlTargets\.worldBook =>.*\n','',s)
          s=re.sub(r'(?m)^\s*AppControlTargets\.worldBook =>.*\n','',s)
          for token in ["'entry_id': {","'book_id': {"]: s=remove_block(s,token,True)
          if "if (bundle['world_books'] is Map)" in s: s=remove_braced_from(s,s.find("if (bundle['world_books'] is Map)"))
          s=re.sub(r"(?m)^\s*'world_books':.*\n",'',s)
          s=re.sub(r"(?m)^\s*AppControlTargets\.worldBook => 'AI Imported World Book',\s*\n",'',s)
          write(p,s)

          p='test/core/services/app_control_service_test.dart'; s=drop_imports(read(p)); start=s.find("  testWidgets('神经权能网关 edits world book entries")
          if start>=0:
              end=s.find("  testWidgets('神经权能网关 records audit log'",start)
              if end>=0: s=s[:start]+s[end:]
          exact='''        ChangeNotifierProvider<WorldBookProvider>(\n          create: (_) => WorldBookProvider(),\n        ),\n'''; s=s.replace(exact,''); write(p,s)

          for pth in Path('lib/l10n').glob('*.arb'):
              data=json.loads(pth.read_text(encoding='utf-8')); data={k:v for k,v in data.items() if 'worldbook' not in k.lower()}; pth.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          write('PROGRESS.md','TASK: 删除世界书功能及全部引用代码\nSTEP: 已实现，准备发布\nDONE: 已移除移动端和桌面端设置中的世界书入口；删除世界书模型、存储、Provider、管理页面、弹窗和聊天选择器；移除消息构建中的世界书提示注入；清理神经权能网关、应用迁移包和测试中的世界书能力；保留其它聊天、指令注入、技能、记忆、MCP、搜索及设置功能。\nNEXT: 更新补丁版本并创建 Release。')
      - name: Regenerate localization and format
        run: |
          flutter pub get
          flutter gen-l10n
          dart format lib test
      - name: Verify no world book references remain
        run: |
          if git grep -inE 'world.?book|世界书' -- ':!PROGRESS.md' ':!.github/workflows/remove-world-book.yml'; then exit 1; fi
      - name: Analyze
        run: flutter analyze
      - name: Commit removal
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: remove world book feature completely"
          git push origin main