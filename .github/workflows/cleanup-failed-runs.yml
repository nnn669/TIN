name: Cleanup Failed Runs After Last Success
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete failed runs after #289
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete Android Test Release failed runs #290-294
          gh api --method DELETE /repos/${{ github.repository }}/actions/runs/31136666030 || true
          gh api --method DELETE /repos/${{ github.repository }}/actions/runs/31136669876 || true
          gh api --method DELETE /repos/${{ github.repository }}/actions/runs/31137342895 || true
          gh api --method DELETE /repos/${{ github.repository }}/actions/runs/31138723434 || true
          gh api --method DELETE /repos/${{ github.repository }}/actions/runs/31141948037 || true
          
          # Delete Repair MCP Import Compile Error failed run
          gh api --method DELETE /repos/${{ github.repository }}/actions/runs/31137351593 || true
          
          echo "Cleanup completed"
