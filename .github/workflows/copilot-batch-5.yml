name: Copilot Batch 5 Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply batch 5 changes
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/core/providers/mcp_provider.dart')
          text = path.read_text(encoding='utf-8')

          old = (
              "  bool _isBuiltinGithubServer(McpServerConfig server) {\n"
              "    return server.transport == McpTransportType.inmemory &&\n"
              "        (server.id == _builtinGithubId || server.name == _builtinGithubName);\n"
              "  }\n\n"
              "  bool isBuiltinServer(McpServerConfig server) {\n"
          )
          new = (
              "  bool _isBuiltinGithubServer(McpServerConfig server) {\n"
              "    return server.transport == McpTransportType.inmemory &&\n"
              "        (server.id == _builtinGithubId || server.name == _builtinGithubName);\n"
              "  }\n\n"
              "  bool _isBuiltinCopilotServer(McpServerConfig server) {\n"
              "    return server.transport == McpTransportType.inmemory &&\n"
              "        (server.id == _builtinCopilotId || server.name == _builtinCopilotName);\n"
              "  }\n\n"
              "  bool isBuiltinServer(McpServerConfig server) {\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'first replacement expected once, got {text.count(old)}')
          text = text.replace(old, new, 1)

          old = (
              "  bool isBuiltinServer(McpServerConfig server) {\n"
              "    return _isBuiltinFetchServer(server) ||\n"
              "        _isBuiltinFilesServer(server) ||\n"
              "        _isBuiltinGithubServer(server) ||\n"
              "        _isBuiltinImagesServer(server);\n"
              "  }\n\n"
              "  bool isBuiltinGithubServer(McpServerConfig server) {\n"
          )
          new = (
              "  bool isBuiltinServer(McpServerConfig server) {\n"
              "    return _isBuiltinFetchServer(server) ||\n"
              "        _isBuiltinFilesServer(server) ||\n"
              "        _isBuiltinGithubServer(server) ||\n"
              "        _isBuiltinImagesServer(server) ||\n"
              "        _isBuiltinCopilotServer(server);\n"
              "  }\n\n"
              "  bool isBuiltinGithubServer(McpServerConfig server) {\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'second replacement expected once, got {text.count(old)}')
          text = text.replace(old, new, 1)

          old = (
              "  bool isBuiltinImagesServer(McpServerConfig server) {\n"
              "    return _isBuiltinImagesServer(server);\n"
              "  }\n\n"
              "  bool _isBuiltinFetchServer(McpServerConfig server) {\n"
          )
          new = (
              "  bool isBuiltinImagesServer(McpServerConfig server) {\n"
              "    return _isBuiltinImagesServer(server);\n"
              "  }\n\n"
              "  bool isBuiltinCopilotServer(McpServerConfig server) {\n"
              "    return _isBuiltinCopilotServer(server);\n"
              "  }\n\n"
              "  bool _isBuiltinFetchServer(McpServerConfig server) {\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'third replacement expected once, got {text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8', newline='')
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/copilot-batch-5.yml
          git add lib/core/providers/mcp_provider.dart .github/workflows/copilot-batch-5.yml
          git commit -m "feat: classify copilot as built-in MCP server"
          git push origin "HEAD:${GITHUB_REF_NAME}"