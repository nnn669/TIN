name: Remove settings sponsor and docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-settings-sponsor-docs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested removals
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          settings_path = Path('lib/features/settings/pages/settings_page.dart')
          text = settings_path.read_text()
          text = text.replace("import 'sponsor_page.dart';\n", '')
          text = text.replace("import 'package:url_launcher/url_launcher.dart';\n", '')

          def remove_mobile_row(source, icon, label):
              pattern = re.compile(
                  rf'\n\s*_iosDivider\(context\),\n'
                  rf'\s*_iosNavRow\(\n'
                  rf'\s*context,\n'
                  rf'\s*icon: Lucide\.{icon},\n'
                  rf'\s*label: l10n\.{label},\n'
                  rf'.*?\n\s*\),',
                  re.S,
              )
              updated, count = pattern.subn('', source, count=1)
              if count != 1:
                  raise SystemExit(f'Expected mobile row {label} was not found')
              return updated

          text = remove_mobile_row(text, 'Library', 'settingsPageDocs')
          text = remove_mobile_row(text, 'Heart', 'settingsPageSponsor')
          settings_path.write_text(text)

          desktop_path = Path('lib/desktop/setting/about_pane.dart')
          desktop = desktop_path.read_text()
          desktop_pattern = re.compile(
              r'\n\s*const _DeskRowDivider\(\),\n'
              r'\s*// Donation item \(desktop\): mirrors mobile "Sponsor"\n'
              r'\s*_DeskNavRow\(\n'
              r'\s*icon: lucide\.Lucide\.Heart,\n'
              r'\s*label: l10n\.settingsPageSponsor,\n'
              r'\s*onTap: \(\) => _showSponsorDesktopDialog\(context\),\n'
              r'\s*\),'
          )
          desktop, count = desktop_pattern.subn('', desktop, count=1)
          if count != 1:
              raise SystemExit('Expected desktop sponsor entry was not found')
          marker = '\nFuture<void> _showSponsorDesktopDialog(BuildContext context) async {'
          if marker not in desktop:
              raise SystemExit('Expected desktop sponsor dialog was not found')
          desktop_path.write_text(desktop[:desktop.index(marker)] + '\n')

          sponsor_page = Path('lib/features/settings/pages/sponsor_page.dart')
          if not sponsor_page.exists():
              raise SystemExit('Expected sponsor page was not found')
          sponsor_page.unlink()

          for path in (settings_path, desktop_path):
              current = path.read_text()
              if any(value in current for value in ('settingsPageDocs', 'settingsPageSponsor', 'SponsorPage')):
                  raise SystemExit(f'Removal validation failed for {path}')
          PY

      - name: Commit feature removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/settings/pages/settings_page.dart
          git add lib/desktop/setting/about_pane.dart
          git add lib/features/settings/pages/sponsor_page.dart
          git commit -m 'feat: remove sponsor and documentation from settings'

      - name: Bump version and update progress
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text()
          match = re.search(r'^version:\s*(\d+)\.(\d+)\.(\d+)\+(\d+)\s*$', text, re.M)
          if not match:
              raise SystemExit('Version not found')
          major, minor, patch, build = map(int, match.groups())
          version = f'{major}.{minor}.{patch + 1}+{build + 1}'
          pubspec.write_text(text[:match.start()] + f'version: {version}' + text[match.end():])
          Path('PROGRESS.md').write_text(
              'TASK: 删除设置中的赞助与使用文档功能\n'
              'STEP: 完成\n'
              'DONE: 已删除移动端使用文档入口、移动端与桌面端赞助入口、赞助页面，并更新版本。\n'
              f'NEXT: 发布 v{version.split("+")[0]} 并检查 Android APK 构建。\n'
          )
          PY

      - name: Commit version and remove migration workflow
        shell: bash
        run: |
          set -euo pipefail
          git add pubspec.yaml PROGRESS.md
          git rm .github/workflows/remove-settings-sponsor-docs.yml
          git commit -m 'chore: bump version for settings cleanup release'
          git push origin HEAD:main