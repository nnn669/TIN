name: Repair MCP Import Compile Error

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace invalid callback control flow
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/core/providers/mcp_provider.dart')
          text = path.read_text(encoding='utf-8')
          old = """            } else if (id == 'kelivo_copilot' || name == '@kelivo/copilot') {
              continue;
            } else if (id == _builtinFetchId || name == _builtinFetchName) {"""
          new = """            } else if (id == 'kelivo_copilot' || name == '@kelivo/copilot') {
              return;
            } else if (id == _builtinFetchId || name == _builtinFetchName) {"""
          if text.count(old) != 1:
              raise SystemExit('expected exactly one invalid legacy Copilot branch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-mcp-import-compile.yml
          git add lib/core/providers/mcp_provider.dart .github/workflows/fix-mcp-import-compile.yml
          git commit -m 'fix(mcp): restore import of legacy server configs'
          git push origin HEAD:main