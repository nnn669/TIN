name: Validate stream 60 FPS

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib/features/home/controllers/stream_controller.dart test/features/home/controllers/stream_controller_content_split_test.dart
      - run: flutter test test/features/home/controllers/stream_controller_content_split_test.dart