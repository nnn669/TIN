name: Temporary feature inspection

on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        default: main
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Apply feature branch migration
        shell: bash
        env:
          TARGET_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          git config user.name "TIN automation"
          git config user.email "actions@github.com"
          curl -fsSL "https://raw.githubusercontent.com/nnn669/TIN/${TARGET_REF}/.github/workflows/apply-feature-removals.yml" -o /tmp/apply.yml
          awk '/python3 - <<'"'"'PY'"'"'/{flag=1; next} flag && /^[[:space:]]*PY$/{exit} flag {sub(/^          /, ""); print}' /tmp/apply.yml > /tmp/apply.py
          test -s /tmp/apply.py
          set +e
          python3 /tmp/apply.py
          APPLY_STATUS=$?
          set -e
          test "$APPLY_STATUS" -eq 0 -o "$APPLY_STATUS" -eq 1
          curl -fsSL "https://raw.githubusercontent.com/nnn669/TIN/${TARGET_REF}/tools/continue_feature_removals.py" -o /tmp/continue.py
          python3 /tmp/continue.py
          if grep -RIn --exclude-dir=.git --exclude='*.g.dart' -E 'assistant\?\.temperature|a\.temperature|clearTemperature|temperature: assistant|S3BackupProvider|S3Config|s3Config|setS3Config|webDavConfig|setWebDavConfig|testWebdav|backupToWebDav|listBackupFiles|restoreFromWebDav|deleteWebDavBackupFile|SponsorPage' lib test; then exit 1; fi
          rm -f tools/continue_feature_removals.py
          git add -A
          git commit -m "feat: remove assistant temperature and remote backup UI"
          git push origin HEAD:${TARGET_REF}
          rm -f .github/workflows/apply-feature-removals.yml .github/workflows/temporary-feature-inspection.yml .github/workflows/temporary-background-inspection.yml
          git add -A
          git commit -m "chore: remove one-shot feature migration workflows"
          git push origin HEAD:${TARGET_REF}