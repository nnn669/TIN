name: Temporary MCP Provider Repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/restore-mcp-provider-for-release
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore provider from verified commit
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=0815ebe861a9336431439de77058cf9409b17ee1 -- lib/core/providers/mcp_provider.dart
          test "$(wc -c < lib/core/providers/mcp_provider.dart)" -gt 1000
          grep -q "class McpProvider" lib/core/providers/mcp_provider.dart
          grep -q "enum McpTransportType" lib/core/providers/mcp_provider.dart
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/repair-mcp-provider.yml
          git add lib/core/providers/mcp_provider.dart .github/workflows/repair-mcp-provider.yml
          git commit -m 'fix(mcp): restore provider after accidental placeholder replacement'
          git push origin HEAD:repair/restore-mcp-provider-for-release