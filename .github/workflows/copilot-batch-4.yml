name: Copilot Batch 4 Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply batch 4 changes
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/core/providers/mcp_provider.dart')
          text = path.read_text(encoding='utf-8')

          old = (
              "            } else if (id == _builtinImagesId || name == _builtinImagesName) {\n"
              "              builtinEnabledById[_builtinImagesId] = enabled;\n"
              "            } else if (id == _builtinFetchId || name == _builtinFetchName) {\n"
          )
          new = (
              "            } else if (id == _builtinImagesId || name == _builtinImagesName) {\n"
              "              builtinEnabledById[_builtinImagesId] = enabled;\n"
              "            } else if (id == _builtinCopilotId || name == _builtinCopilotName) {\n"
              "              builtinEnabledById[_builtinCopilotId] = enabled;\n"
              "            } else if (id == _builtinFetchId || name == _builtinFetchName) {\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'first replacement expected once, got {text.count(old)}')
          text = text.replace(old, new, 1)

          old = (
              "          next.add(\n"
              "            _builtinServer(\n"
              "              _builtinImagesId,\n"
              "              _builtinImagesName,\n"
              "              enabled: false,\n"
              "            ).copyWith(enabled: builtinEnabledById[_builtinImagesId] ?? false),\n"
              "          );\n"
              "        }\n"
          )
          new = (
              "          next.add(\n"
              "            _builtinServer(\n"
              "              _builtinImagesId,\n"
              "              _builtinImagesName,\n"
              "              enabled: false,\n"
              "            ).copyWith(enabled: builtinEnabledById[_builtinImagesId] ?? false),\n"
              "          );\n"
              "          next.add(\n"
              "            _builtinServer(\n"
              "              _builtinCopilotId,\n"
              "              _builtinCopilotName,\n"
              "              enabled: false,\n"
              "            ).copyWith(enabled: builtinEnabledById[_builtinCopilotId] ?? false),\n"
              "          );\n"
              "        }\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'second replacement expected once, got {text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8', newline='')
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/copilot-batch-4.yml
          git add lib/core/providers/mcp_provider.dart .github/workflows/copilot-batch-4.yml
          git commit -m "feat: preserve copilot state during MCP import"
          git push origin "HEAD:${GITHUB_REF_NAME}"