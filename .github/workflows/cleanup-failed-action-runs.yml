name: Cleanup Failed Action Runs

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete failed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t run_ids < <(
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GH_REPO}/actions/runs?status=failure&per_page=100" \
              --jq '.workflow_runs[].id'
          )
          echo "Deleting ${#run_ids[@]} failed workflow runs"
          for run_id in "${run_ids[@]}"; do
            gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GH_REPO}/actions/runs/${run_id}"
          done