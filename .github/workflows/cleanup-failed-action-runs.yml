name: Cleanup Failed Action Runs

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete failed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          deleted=0
          while true; do
            run_id="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GH_REPO}/actions/runs?status=failure&per_page=1" \
              --jq '.workflow_runs[0].id // empty')"
            if [[ -z "${run_id}" ]]; then
              break
            fi
            gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GH_REPO}/actions/runs/${run_id}"
            deleted=$((deleted + 1))
            echo "Deleted failed workflow run ${run_id} (${deleted})"
          done
          echo "Deleted ${deleted} failed workflow runs"