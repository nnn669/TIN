name: Apply model selector collapse

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/model/widgets/model_select_sheet.dart')
          s = p.read_text()
          if 'class _ProviderGroupHeaderRow extends _ListRow' in s:
              print('already patched')
              raise SystemExit(0)
          s = s.replace("import 'model_detail_sheet.dart';\n", '', 1)
          s = s.replace('if (row is _ModelRow && !row.showProviderLabel) return row.item.providerKey;', 'if (row is _ModelRow) return row.item.providerKey;', 1)
          s = s.replace('    final query = _search.text.trim();\n    // Build flattened rows and index maps for precise positioning', '    final settings = context.watch<SettingsProvider>();\n    final query = _search.text.trim();\n    // Build flattened rows and index maps for precise positioning', 1)
          old = """      _headerIndexMap[pk] = _rows.length;
      _rows.add(_HeaderRow(g.name, providerKey: pk));
      for (final m in items) {
        _modelIndexMap['${m.providerKey}::${m.id}'] = _rows.length;
        _rows.add(_ModelRow(m));
      }"""
          new = """      final groupKey = settings.groupIdForProvider(pk) ?? SettingsProvider.providerUngroupedGroupKey;
      if (widget.limitProviderKey == null && _headerIndexMap[groupKey] == null) {
        _headerIndexMap[groupKey] = _rows.length;
        _rows.add(_ProviderGroupHeaderRow(groupKey: groupKey, title: groupKey == SettingsProvider.providerUngroupedGroupKey ? l10n.providerGroupsOther : (settings.groupById(groupKey)?.name ?? l10n.providerGroupsOther), count: 1, collapsed: query.isEmpty && settings.isGroupCollapsed(groupKey)));
      }
      if (widget.limitProviderKey == null && query.isEmpty && settings.isGroupCollapsed(groupKey)) continue;
      for (final m in items) {
        _modelIndexMap['${m.providerKey}::${m.id}'] = _rows.length;
        _rows.add(_ModelRow(m, showProviderLabel: true));
      }"""
          if old not in s:
              raise SystemExit('target block not found')
          s = s.replace(old, new, 1)
          s = s.replace('''                if (row is _HeaderRow) {
                  return _sectionHeader(
                    context,
                    row.title,
                    providerKey: row.providerKey,
                  );''', '''                if (row is _ProviderGroupHeaderRow) {
                  return GestureDetector(
                    behavior: HitTestBehavior.opaque,
                    onTap: () => unawaited(context.read<SettingsProvider>().toggleGroupCollapsed(row.groupKey)),
                    child: _sectionHeader(context, row.title),
                  );
                } else if (row is _HeaderRow) {
                  return _sectionHeader(
                    context,
                    row.title,
                    providerKey: row.providerKey,
                  );''', 1)
          s = s.replace('class _HeaderRow extends _ListRow {', '''class _ProviderGroupHeaderRow extends _ListRow {
  final String groupKey;
  final String title;
  final int count;
  final bool collapsed;
  const _ProviderGroupHeaderRow({required this.groupKey, required this.title, required this.count, required this.collapsed});
}

class _HeaderRow extends _ListRow {''', 1)
          p.write_text(s)
          assert 'class _ProviderGroupHeaderRow extends _ListRow' in s
          assert 'toggleGroupCollapsed(row.groupKey)' in s
          assert 'isGroupCollapsed(groupKey)' in s
          print('source patch validation passed')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/model/widgets/model_select_sheet.dart
          git commit -m 'feat: add collapsible model selector groups'
          git push origin main