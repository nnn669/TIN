name: cleanup-desktop-theme-palette

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply scoped Android cleanup
        shell: python
        run: |
          from pathlib import Path
          import re
          
          main = Path("lib/main.dart")
          text = main.read_text()
          for line in [
              "import 'package:system_fonts/system_fonts.dart';\n",
              "import 'package:window_manager/window_manager.dart';\n",
              "import 'desktop/desktop_home_page.dart';\n",
              "import 'desktop/desktop_tray_controller.dart';\n",
              "import 'desktop/desktop_window_controller.dart';\n",
          ]:
              text = text.replace(line, "")
          text = text.replace("      await _initDesktopWindow();\n", "")
          text = re.sub(r"\nFuture<void> _initDesktopWindow\(\) async \{.*?\n\}\n\n", "\n", text, flags=re.S)
          text = text.replace("  final SystemFonts _systemFonts = SystemFonts();\n", "")
          text = text.replace("  final Set<String> _loadedSystemFonts = <String>{};\n", "")
          text = text.replace("  String? _lastTraySyncKey;\n", "")
          text = text.replace("    _scheduleDesktopFontLoads(settings);\n", "")
          text = text.replace("            _scheduleDesktopTraySync(ctx);\n", "")
          text = text.replace("l10n.chatServiceDefault.conversationTitle", "l10n.chatServiceDefaultConversationTitle")
          text = text.replace("l10n.userProviderDefault.userName", "l10n.userProviderDefaultUserName")
          text = re.sub(r"\n  void _scheduleDesktopFontLoads\(.*?\n  bool _wantsSystemAppFont", "\n  bool _wantsSystemAppFont", text, flags=re.S)
          text = re.sub(r"\n  void _scheduleDesktopTraySync\(.*?\n  ThemeData _applyAppFont", "\n  ThemeData _applyAppFont", text, flags=re.S)
          text = re.sub(r"Widget _selectHome\(\) \{.*?\n\}", "Widget _selectHome() => const HomePage();", text, flags=re.S)
          main.write_text(text)
          
          display = Path("lib/desktop/setting/display_pane.dart")
          text = display.read_text()
          text = text.replace("for (final p in ThemePalettes.all)", "for (final p in [ThemePalettes.defaultPalette])")
          display.write_text(text)
      - name: Commit cleanup and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/cleanup-desktop-theme-palette.yml
          rm -f .github/workflows/remove-legacy-desktop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/desktop/setting/display_pane.dart .github/workflows
          git commit -m "fix: complete Android-only desktop cleanup wiring"
          git push