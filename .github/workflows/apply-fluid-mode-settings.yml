name: Apply fluid mode settings integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chat-fluid-background
      - name: Patch settings mode picker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/settings/pages/settings_page.dart')
          text = path.read_text()
          text = text.replace("import 'package:tin/theme/app_font_weights.dart';\n", "import 'package:tin/theme/app_font_weights.dart';\nimport '../../home/widgets/chat_fluid_motion_controller.dart';\n", 1)
          text = text.replace("class SettingsPage extends StatelessWidget {", "enum _ThemeModeChoice { system, light, dark, fluid }\n\nclass SettingsPage extends StatelessWidget {", 1)
          text = text.replace("    Future<void> pickThemeMode() async {\n      final settingsProvider = context.read<SettingsProvider>();\n      final selected = await showModalBottomSheet<ThemeMode>(", "    String fluidModeLabel() =>\n        Localizations.localeOf(context).languageCode == 'zh'\n        ? '流体动效'\n        : 'Fluid motion';\n\n    Future<void> pickThemeMode() async {\n      final settingsProvider = context.read<SettingsProvider>();\n      final selected = await showModalBottomSheet<_ThemeModeChoice>(", 1)
          text = text.replace("Navigator.of(ctx).pop(ThemeMode.system)", "Navigator.of(ctx).pop(_ThemeModeChoice.system)", 1)
          text = text.replace("Navigator.of(ctx).pop(ThemeMode.light)", "Navigator.of(ctx).pop(_ThemeModeChoice.light)", 1)
          text = text.replace("Navigator.of(ctx).pop(ThemeMode.dark)", "Navigator.of(ctx).pop(_ThemeModeChoice.dark)", 1)
          text = text.replace("                  ),\n                ],\n              ),\n            ),\n          );\n        },\n      );\n      if (selected != null) {\n        await settingsProvider.setThemeMode(selected);\n      }", "                  ),\n                  _sheetDivider(ctx),\n                  _sheetOption(\n                    ctx,\n                    icon: Lucide.Waves,\n                    label: fluidModeLabel(),\n                    onTap: () => Navigator.of(ctx).pop(_ThemeModeChoice.fluid),\n                  ),\n                ],\n              ),\n            ),\n          );\n        },\n      );\n      if (selected == null) return;\n      final fluidEnabled = selected == _ThemeModeChoice.fluid;\n      await ChatFluidMotionController.instance.setEnabled(fluidEnabled);\n      if (!fluidEnabled) {\n        final mode = switch (selected) {\n          _ThemeModeChoice.system => ThemeMode.system,\n          _ThemeModeChoice.light => ThemeMode.light,\n          _ThemeModeChoice.dark => ThemeMode.dark,\n          _ThemeModeChoice.fluid => settingsProvider.themeMode,\n        };\n        await settingsProvider.setThemeMode(mode);\n      }", 1)
          text = text.replace("                detailText: modeLabel(settings.themeMode),", "                detailText: ChatFluidMotionController.instance.enabled\n                    ? fluidModeLabel()\n                    : modeLabel(settings.themeMode),", 1)
          path.write_text(text)
          PY
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/settings/pages/settings_page.dart
          git diff --cached --quiet || git commit -m "feat(settings): add fluid motion color mode"
          git push origin HEAD:feat/chat-fluid-background