name: Apply fluid mode settings integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chat-fluid-background
      - name: Refresh fluid mode detail label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/settings/pages/settings_page.dart')
          text = path.read_text()
          old = """                detailText: ChatFluidMotionController.instance.enabled
                    ? fluidModeLabel()
                    : modeLabel(settings.themeMode),
                onTap: pickThemeMode,"""
          new = """                detailBuilder: (_) => ListenableBuilder(
                  listenable: ChatFluidMotionController.instance,
                  builder: (_, __) => Text(
                    ChatFluidMotionController.instance.enabled
                        ? fluidModeLabel()
                        : modeLabel(settings.themeMode),
                  ),
                ),
                onTap: pickThemeMode,"""
          if old not in text:
              raise SystemExit('Expected fluid mode detail was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/settings/pages/settings_page.dart
          git diff --cached --quiet || git commit -m "fix(settings): refresh fluid mode label"
          git push origin HEAD:feat/chat-fluid-background