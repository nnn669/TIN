name: Initialize Android Signing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-signing-bootstrap
  cancel-in-progress: false

jobs:
  generate-signing-key:
    name: Generate encrypted signing backup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate encrypted Android signing key
        shell: bash
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          SIGN_STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$SIGN_KEYSTORE_BASE64" ]]; then
            echo "SIGN_KEYSTORE_BASE64 is already configured; refusing to replace the signing identity."
            exit 1
          fi
          if [[ -z "$SIGN_STORE_PASSWORD" || -z "$SIGN_KEY_ALIAS" || -z "$SIGN_KEY_PASSWORD" ]]; then
            echo "Configure SIGN_STORE_PASSWORD, SIGN_KEY_ALIAS, and SIGN_KEY_PASSWORD before running this workflow."
            exit 1
          fi
          if [[ ${#SIGN_STORE_PASSWORD} -lt 8 || ${#SIGN_KEY_PASSWORD} -lt 8 ]]; then
            echo "Signing passwords must contain at least 8 characters."
            exit 1
          fi
          if [[ ! "$SIGN_KEY_ALIAS" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "SIGN_KEY_ALIAS may contain only letters, numbers, dots, underscores, and hyphens."
            exit 1
          fi

          mkdir -p signing-backup
          keytool -genkeypair \
            -keystore signing-backup/tin-release.jks \
            -storetype JKS \
            -storepass "$SIGN_STORE_PASSWORD" \
            -alias "$SIGN_KEY_ALIAS" \
            -keypass "$SIGN_KEY_PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=TIN Android Release, OU=Android, O=TIN, C=CN" \
            -noprompt
          keytool -list \
            -keystore signing-backup/tin-release.jks \
            -storepass "$SIGN_STORE_PASSWORD" \
            -alias "$SIGN_KEY_ALIAS" >/dev/null
          base64 --wrap=0 signing-backup/tin-release.jks > signing-backup/SIGN_KEYSTORE_BASE64.txt
          test -s signing-backup/tin-release.jks
          test -s signing-backup/SIGN_KEYSTORE_BASE64.txt
          chmod 600 signing-backup/tin-release.jks signing-backup/SIGN_KEYSTORE_BASE64.txt
          sha256sum signing-backup/tin-release.jks
      - name: Upload encrypted signing backup
        uses: actions/upload-artifact@v4
        with:
          name: TIN-android-signing-backup-${{ github.run_number }}
          path: signing-backup/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
