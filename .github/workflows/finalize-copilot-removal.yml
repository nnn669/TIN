name: Finalize Copilot Placeholder Removal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove stale placeholder branches
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('lib/core/providers/mcp_provider.dart')
          text = path.read_text(encoding='utf-8')

          branch = re.escape(
              """            } else if (id == _builtinCopilotId || name == _builtinCopilotName) {
                builtinEnabledById[_builtinCopilotId] = enabled;
"""
          )
          updated, count = re.subn(branch, '', text, count=1)
          if count != 1:
              raise SystemExit(f'copilot import branch expected once, got {count}')
          text = updated

          block = re.escape(
              """          next.add(
            _builtinServer(
              _builtinCopilotId,
              _builtinCopilotName,
              enabled: false,
            ).copyWith(enabled: builtinEnabledById[_builtinCopilotId] ?? false),
          );
"""
          )
          updated, count = re.subn(block, '', text, count=1)
          if count != 1:
              raise SystemExit(f'copilot fallback block expected once, got {count}')
          text = updated

          if '_builtinCopilot' in text or 'KelivoCopilot' in text:
              raise SystemExit('stale copilot implementation references remain')

          path.write_text(text, encoding='utf-8')

      - name: Remove temporary cleanup workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/remove-copilot-placeholder.yml
          rm -f .github/workflows/finalize-copilot-removal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/providers/mcp_provider.dart .github/workflows/remove-copilot-placeholder.yml .github/workflows/finalize-copilot-removal.yml
          git commit -m "fix(mcp): remove remaining copilot placeholder references"
          git push origin HEAD:main