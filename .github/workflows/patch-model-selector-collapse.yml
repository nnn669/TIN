name: Temporary model selector collapse patch

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'feat: add collapsible model selector groups'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch model selector
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/features/model/widgets/model_select_sheet.dart')
          s = p.read_text(encoding='utf-8')
          if 'class _ProviderGroupHeaderRow extends _ListRow' in s:
              print('collapse patch already present')
              raise SystemExit(0)

          def once(old, new, label):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, got {s.count(old)}')
              s = s.replace(old, new, 1)

          s = s.replace("import 'model_detail_sheet.dart';\n", '', 1)
          once(
              "    if (row is _HeaderRow) return row.providerKey;\n    if (row is _ModelRow && !row.showProviderLabel) return row.item.providerKey;\n",
              "    if (row is _HeaderRow) return row.providerKey;\n    if (row is _ModelRow) return row.item.providerKey;\n",
              'active provider rows',
          )
          once(
              "    final l10n = AppLocalizations.of(context)!;\n    final query = _search.text.trim();\n    // Build flattened rows and index maps for precise positioning\n",
              "    final l10n = AppLocalizations.of(context)!;\n    final settings = context.watch<SettingsProvider>();\n    final query = _search.text.trim();\n    // Build flattened rows and index maps for precise positioning\n",
              'settings watch',
          )
          start = s.index('    for (final pk in _orderedKeys) {', s.index('Widget _buildContent'))
          end = s.index('\n    if (_rows.isEmpty) return const SizedBox.shrink();', start)
          block = s[start:end]
          new_block = '''    String groupKeyFor(String providerKey) =>
        settings.groupIdForProvider(providerKey) ??
        SettingsProvider.providerUngroupedGroupKey;
    String groupTitleFor(String groupKey) =>
        groupKey == SettingsProvider.providerUngroupedGroupKey
            ? l10n.providerGroupsOther
            : (settings.groupById(groupKey)?.name ?? l10n.providerGroupsOther);
    String? lastGroupKey;
    final groupProviderKeys = <String, Set<String>>{};
    for (final pk in _orderedKeys) {
      groupProviderKeys.putIfAbsent(groupKeyFor(pk), () => <String>{}).add(pk);
    }
    for (final pk in _orderedKeys) {
      final g = _groups[pk]!;
      List<_ModelItem> items;
      if (query.isEmpty) {
        items = g.items;
      } else {
        final providerMatches = _providerMatchesSearch(query, g.name);
        items = providerMatches
            ? g.items
            : g.items.where((e) => _matchesSearch(query, e, g.name)).toList();
        if (favMatchedKeys.isNotEmpty) {
          items = items.where((e) =>
              !favMatchedKeys.contains('${e.providerKey}::${e.id}')).toList();
        }
      }
      if (items.isEmpty) continue;
      final groupKey = groupKeyFor(pk);
      if (widget.limitProviderKey == null && groupKey != lastGroupKey) {
        final collapsed = query.isEmpty && settings.isGroupCollapsed(groupKey);
        _headerIndexMap[groupKey] = _rows.length;
        _rows.add(_ProviderGroupHeaderRow(
          groupKey: groupKey,
          title: groupTitleFor(groupKey),
          count: groupProviderKeys[groupKey]?.length ?? 0,
          collapsed: collapsed,
        ));
        lastGroupKey = groupKey;
        if (collapsed) continue;
      } else if (widget.limitProviderKey == null && query.isEmpty &&
          settings.isGroupCollapsed(groupKey)) {
        continue;
      }
      for (final m in items) {
        _modelIndexMap['${m.providerKey}::${m.id}'] = _rows.length;
        _rows.add(_ModelRow(m, showProviderLabel: true));
      }
    }
'''
          s = s[:start] + new_block + s[end:]
          once(
              "                if (row is _HeaderRow) {\n                  return _sectionHeader(\n",
              "                if (row is _ProviderGroupHeaderRow) {\n                  return _providerGroupHeader(context, row);\n                } else if (row is _HeaderRow) {\n                  return _sectionHeader(\n",
              'group row rendering',
          )
          once(
              '  Widget _sectionHeader(\n',
              '''  Widget _providerGroupHeader(BuildContext context, _ProviderGroupHeaderRow row) {
    final cs = Theme.of(context).colorScheme;
    return GestureDetector(
      behavior: HitTestBehavior.opaque,
      onTap: () => unawaited(
        context.read<SettingsProvider>().toggleGroupCollapsed(row.groupKey),
      ),
      child: Padding(
        padding: const EdgeInsets.fromLTRB(16, 14, 16, 8),
        child: Row(children: [
          AnimatedRotation(
            turns: row.collapsed ? 0.0 : 0.25,
            duration: const Duration(milliseconds: 220),
            child: Icon(Lucide.ChevronRight, size: 20,
                color: cs.onSurface.withValues(alpha: 0.72)),
          ),
          const SizedBox(width: 8),
          Expanded(child: Text(row.title, maxLines: 1,
              overflow: TextOverflow.ellipsis,
              style: TextStyle(fontSize: 13,
                  fontWeight: AppFontWeights.emphasis,
                  color: cs.onSurface.withValues(alpha: 0.72)))),
          Text('${row.count}', style: TextStyle(color: cs.primary,
              fontSize: 12, fontWeight: AppFontWeights.emphasis)),
        ]),
      ),
    );
  }

  Widget _sectionHeader(
''',
              'group header widget',
          )
          once(
              '''          onLongPress: () async {
            await showModelDetailSheet(
              context,
              providerKey: m.providerKey,
              modelId: m.id,
            );
            if (mounted) {
              _isLoading = true;
              setState(() {});
              await _loadModelsAsync();
            }
          },
''',
              '',
              'mobile model long press',
          )
          once(
              'class _HeaderRow extends _ListRow {\n',
              '''class _ProviderGroupHeaderRow extends _ListRow {
  final String groupKey;
  final String title;
  final int count;
  final bool collapsed;
  const _ProviderGroupHeaderRow({required this.groupKey, required this.title,
      required this.count, required this.collapsed});
}

class _HeaderRow extends _ListRow {
''',
              'group row class',
          )
          p.write_text(s, encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          s = Path('lib/features/model/widgets/model_select_sheet.dart').read_text()
          for marker in ('class _ProviderGroupHeaderRow extends _ListRow', 'toggleGroupCollapsed(row.groupKey)', 'settings.isGroupCollapsed(groupKey)'):
              assert marker in s, marker
          assert "import 'model_detail_sheet.dart';" not in s
          print('collapse source validation passed')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/model/widgets/model_select_sheet.dart
          git commit -m 'feat: add collapsible model selector groups'
          git push origin main
          git rm .github/workflows/patch-model-selector-collapse.yml
          git commit -m 'chore: remove temporary model selector patch workflow'
          git push origin main