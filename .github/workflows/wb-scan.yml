name: Scan world book references
on:
  push:
    branches:
      - remove-world-book
    paths:
      - '.github/workflows/wb-scan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print context for remaining references
        run: |
          for f in lib/desktop/desktop_settings_page.dart lib/features/settings/pages/settings_page.dart lib/features/chat/widgets/bottom_tools_sheet.dart lib/features/assistant/pages/assistant_settings_edit_basic_tab.dart; do
            echo "===== $f ====="
            grep -n -C 8 -E 'world_book|WorldBook|worldBook' "$f" || echo "clean"
          done
