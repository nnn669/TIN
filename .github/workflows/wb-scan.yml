name: Scan world book references
on:
  push:
    branches:
      - remove-world-book
    paths:
      - '.github/workflows/wb-scan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep remaining references outside l10n
        run: |
          grep -RIn -E 'world_book|WorldBook|worldBook' lib test --exclude-dir=l10n || echo "NO_MATCH_OUTSIDE_L10N"
