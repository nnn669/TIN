      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies and run generators
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Format and analyze
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/core/services/termux_command.dart lib/core/services/mcp/kelivo_termux/kelivo_termux_server.dart lib/core/providers/mcp_provider.dart lib/features/home/services/local_tools_service.dart test/termux_command_test.dart test/kelivo_termux_mcp_server_test.dart
          flutter analyze

      - name: Run related Flutter tests
        shell: bash
        run: |
          set -euo pipefail
          flutter test test/termux_command_test.dart test/kelivo_termux_mcp_server_test.dart test/local_tools_service_test.dart test/mcp_lifecycle_reconnect_test.dart

      - name: Verify Android arm64 debug build
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --target-platform android-arm64

      - name: Restore temporary workflow and commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/patch_deepseek_thinking.yml
          git status --short
          git config user.name 'TIN Bot'
          git config user.email 'actions@github.com'
          git add android/app/src/main/AndroidManifest.xml android/app/src/main/kotlin/com/psyche/tin/TermuxCommandHandler.kt android/app/src/main/kotlin/com/psyche/tin/TermuxCommandResultService.kt lib/core/providers/mcp_provider.dart lib/core/services/termux_command.dart lib/core/services/mcp/kelivo_termux/kelivo_termux_server.dart lib/features/home/services/local_tools_service.dart test/termux_command_test.dart test/kelivo_termux_mcp_server_test.dart test/termux_local_tool_test.dart .github/workflows/patch_deepseek_thinking.yml
          git diff --cached --check
          git commit -m 'feat(mcp): move Termux execution behind built-in server'
          git push origin HEAD:automation/termux-mcp-patch
