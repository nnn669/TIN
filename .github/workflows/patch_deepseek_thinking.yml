          Path('lib/core/services/mcp/kelivo_termux/kelivo_termux_server.dart').write_text(r'''import 'dart:async';
import 'dart:convert';

import 'package:flutter/foundation.dart';
import 'package:flutter/services.dart';
import 'package:mcp_client/mcp_client.dart' as mcp;

import '../../termux_command.dart';
import '../in_memory_mcp_server.dart';

typedef TermuxCommandExecutor = Future<Map<String, dynamic>> Function({
  required String command,
  required List<String> arguments,
  required String? workingDirectory,
  required bool background,
  required int timeoutSeconds,
});

class KelivoTermuxMcpServerEngine implements KelivoInMemoryMcpServerEngine {
  KelivoTermuxMcpServerEngine({
    TermuxCommandExecutor? executor,
    bool Function()? isSupported,
  }) : _executor = executor ?? _runCommand,
       _isSupported = isSupported ?? _isAndroid;

  final TermuxCommandExecutor _executor;
  final bool Function() _isSupported;
  bool _closed = false;

  static Future<Map<String, dynamic>> _runCommand({
    required String command,
    required List<String> arguments,
    required String? workingDirectory,
    required bool background,
    required int timeoutSeconds,
  }) {
    return TermuxCommand.run(
      command: command,
      arguments: arguments,
      workingDirectory: workingDirectory,
      background: background,
      timeoutSeconds: timeoutSeconds,
    );
  }

  static bool _isAndroid() =>
      !kIsWeb && defaultTargetPlatform == TargetPlatform.android;

  @override
  Future<dynamic> handleMessage(dynamic message) async {
    if (_closed) return null;
    if (message is List) {
      final responses = <dynamic>[];
      for (final item in message) {
        responses.add(await _handleSingle(item));
      }
      return responses;
    }
    return _handleSingle(message);
  }

  Future<Map<String, dynamic>> _handleSingle(dynamic raw) async {
    if (raw is! Map) {
      return _error(null, code: -32600, message: 'Invalid Request');
    }
    final request = raw.cast<String, dynamic>();
    final id = request['id'];
    final method = (request['method'] ?? '').toString();
    final params = request['params'] is Map
        ? (request['params'] as Map).cast<String, dynamic>()
        : <String, dynamic>{};

    switch (method) {
      case mcp.McpProtocol.methodInitialize:
        return _ok(id, {
          'serverInfo': {'name': '@kelivo/termux', 'version': '1.0.0'},
          'protocolVersion': mcp.McpProtocol.defaultVersion,
          'capabilities': {
            'tools': {'listChanged': false},
          },
        });
      case mcp.McpProtocol.methodListTools:
        return _ok(id, {
          'tools': [_toolDefinition],
        });
      case mcp.McpProtocol.methodCallTool:
        final name = (params['name'] ?? '').toString();
        if (name != 'termux_run_command') {
          return _error(id, code: -32101, message: 'Tool not found: $name');
        }
        final arguments = params['arguments'];
        final result = await _call(arguments);
        return _ok(id, result);
      default:
        if (id == null) return {'jsonrpc': '2.0'};
        return _error(id, code: -32601, message: 'Method not found: $method');
    }
  }

  Future<Map<String, dynamic>> _call(dynamic rawArguments) async {
    if (!_isSupported()) {
      return _toolResult(
        const {
          'success': false,
          'error': 'unsupported_platform',
          'message': 'Termux commands are only available on Android.',
        },
        isError: true,
      );
    }
    if (rawArguments is! Map) {
      return _invalidArguments('arguments must be an object');
    }
    final args = rawArguments.cast<String, dynamic>();
    final command = args['command'];
    if (command is! String || command.trim().isEmpty) {
      return _invalidArguments('command is required');
    }
    final rawCommandArguments = args['arguments'];
    if (rawCommandArguments != null &&
        (rawCommandArguments is! List ||
            rawCommandArguments.any((value) => value is! String))) {
      return _invalidArguments('arguments must be an array of strings');
    }
    final workingDirectory = args['working_directory'];
    if (workingDirectory != null && workingDirectory is! String) {
      return _invalidArguments('working_directory must be a string');
    }
    final rawTimeout = args['timeout_seconds'];
    if (rawTimeout != null && rawTimeout is! int) {
      return _invalidArguments('timeout_seconds must be an integer');
    }
    final timeoutSeconds = rawTimeout as int? ?? TermuxCommand.defaultTimeoutSeconds;

    try {
      final result = await _executor(
        command: command,
        arguments: rawCommandArguments is List
            ? rawCommandArguments.cast<String>()
            : const <String>[],
        workingDirectory: workingDirectory as String?,
        background: true,
        timeoutSeconds: timeoutSeconds,
      );
      return _toolResult(result, isError: result['success'] != true);
    } on PlatformException catch (error) {
      return _toolResult(
        {
          'success': false,
          'error': error.code,
          'message': error.message ?? 'Termux command failed.',
        },
        isError: true,
      );
    } on TimeoutException {
      return _toolResult(
        const {
          'success': false,
          'error': 'termux_timeout',
          'message': 'Termux command did not finish before the timeout.',
        },
        isError: true,
      );
    } on ArgumentError catch (error) {
      return _invalidArguments(error.message?.toString() ?? error.toString());
    } catch (error) {
      return _toolResult(
        {
          'success': false,
          'error': 'termux_command_failed',
          'message': error.toString(),
        },
        isError: true,
      );
    }
  }

  Map<String, dynamic> _invalidArguments(String message) {
    return _toolResult(
      {'success': false, 'error': 'invalid_arguments', 'message': message},
      isError: true,
    );
  }

  Map<String, dynamic> _toolResult(
    Map<String, dynamic> payload, {
    required bool isError,
  }) {
    return {
      'content': [
        {'type': 'text', 'text': jsonEncode(payload)},
      ],
      'isStreaming': false,
      'isError': isError,
    };
  }

  Map<String, dynamic> _ok(dynamic id, Map<String, dynamic> result) => {
    'jsonrpc': '2.0',
    if (id != null) 'id': id,
    'result': result,
  };

  Map<String, dynamic> _error(
    dynamic id, {
    required int code,
    required String message,
  }) => {
    'jsonrpc': '2.0',
    if (id != null) 'id': id,
    'error': {'code': code, 'message': message},
  };

  static const Map<String, dynamic> _toolDefinition = {
    'name': 'termux_run_command',
    'description':
        '通过本机 Termux 执行单个已安装命令并返回退出码、标准输出和标准错误。仅在用户明确要求调用 Termux 时使用；命令与参数必须分开传递，不支持 shell 拼接。',
    'inputSchema': {
      'type': 'object',
      'properties': {
        'command': {
          'type': 'string',
          'description': 'Termux 可执行文件名，例如 python、git、pkg，不含路径。',
        },
        'arguments': {
          'type': 'array',
          'description': '按顺序传给命令的独立参数。',
          'items': {'type': 'string'},
          'maxItems': TermuxCommand.maxArguments,
        },
        'working_directory': {
          'type': 'string',
          'description': '可选工作目录，必须位于 /data/data/com.termux/files/ 内。',
        },
        'timeout_seconds': {
          'type': 'integer',
          'description': '等待命令结果的秒数。',
          'minimum': TermuxCommand.minTimeoutSeconds,
          'maximum': TermuxCommand.maxTimeoutSeconds,
          'default': TermuxCommand.defaultTimeoutSeconds,
        },
      },
      'required': ['command'],
    },
  };

  @override
  void close() {
    _closed = true;
  }
}
''', encoding='utf-8')

          Path('test/kelivo_termux_mcp_server_test.dart').write_text(r'''import 'dart:async';
import 'dart:convert';

import 'package:flutter_test/flutter_test.dart';

import 'package:tin/core/services/mcp/kelivo_termux/kelivo_termux_server.dart';

void main() {
  group('KelivoTermuxMcpServerEngine', () {
    test('lists one controlled Termux command tool', () async {
      final engine = KelivoTermuxMcpServerEngine(isSupported: () => true);
      addTearDown(engine.close);

      final response = await engine.handleMessage({
        'jsonrpc': '2.0',
        'id': 1,
        'method': 'tools/list',
      }) as Map<String, dynamic>;
      final tools = response['result']['tools'] as List;
      final tool = tools.single as Map;
      final schema = tool['inputSchema'] as Map;

      expect(tool['name'], 'termux_run_command');
      expect(schema['required'], const ['command']);
      expect(schema['properties']['arguments']['maxItems'], 64);
      expect(schema['properties']['timeout_seconds']['maximum'], 25);
    });

    test('returns stdout and forces result-producing background mode', () async {
      late Map<String, dynamic> received;
      final engine = KelivoTermuxMcpServerEngine(
        isSupported: () => true,
        executor: ({
          required command,
          required arguments,
          required workingDirectory,
          required background,
          required timeoutSeconds,
        }) async {
          received = {
            'command': command,
            'arguments': arguments,
            'workingDirectory': workingDirectory,
            'background': background,
            'timeoutSeconds': timeoutSeconds,
          };
          return {
            'success': true,
            'exitCode': 0,
            'stdout': 'clean\n',
            'stderr': '',
          };
        },
      );
      addTearDown(engine.close);

      final response = await engine.handleMessage({
        'jsonrpc': '2.0',
        'id': 2,
        'method': 'tools/call',
        'params': {
          'name': 'termux_run_command',
          'arguments': {
            'command': 'git',
            'arguments': ['status', '--short'],
            'working_directory': '/data/data/com.termux/files/home/project',
            'timeout_seconds': 20,
          },
        },
      }) as Map<String, dynamic>;
      final result = response['result'] as Map<String, dynamic>;
      final payload = jsonDecode(result['content'][0]['text'] as String) as Map;

      expect(received['background'], isTrue);
      expect(received['timeoutSeconds'], 20);
      expect(received['arguments'], const ['status', '--short']);
      expect(result['isError'], isFalse);
      expect(payload['exitCode'], 0);
      expect(payload['stdout'], 'clean\n');
    });

    test('marks non-zero exit as an MCP error with stderr intact', () async {
      final engine = KelivoTermuxMcpServerEngine(
        isSupported: () => true,
        executor: ({
          required command,
          required arguments,
          required workingDirectory,
          required background,
          required timeoutSeconds,
        }) async => {
          'success': false,
          'exitCode': 2,
          'stdout': '',
          'stderr': 'bad option',
        },
      );
      addTearDown(engine.close);

      final response = await engine.handleMessage({
        'jsonrpc': '2.0',
        'id': 3,
        'method': 'tools/call',
        'params': {
          'name': 'termux_run_command',
          'arguments': {'command': 'git'},
        },
      }) as Map<String, dynamic>;
      final result = response['result'] as Map<String, dynamic>;
      final payload = jsonDecode(result['content'][0]['text'] as String) as Map;

      expect(result['isError'], isTrue);
      expect(payload['exitCode'], 2);
      expect(payload['stderr'], 'bad option');
    });

    test('rejects invalid arguments without invoking Android', () async {
      var invoked = false;
      final engine = KelivoTermuxMcpServerEngine(
        isSupported: () => true,
        executor: ({
          required command,
          required arguments,
          required workingDirectory,
          required background,
          required timeoutSeconds,
        }) async {
          invoked = true;
          return <String, dynamic>{};
        },
      );
      addTearDown(engine.close);

      final response = await engine.handleMessage({
        'jsonrpc': '2.0',
        'id': 4,
        'method': 'tools/call',
        'params': {
          'name': 'termux_run_command',
          'arguments': {'command': 'echo', 'arguments': 'hello'},
        },
      }) as Map<String, dynamic>;
      final result = response['result'] as Map<String, dynamic>;

      expect(invoked, isFalse);
      expect(result['isError'], isTrue);
      expect(result['content'][0]['text'], contains('invalid_arguments'));
    });

    test('returns explicit unsupported-platform failure', () async {
      final engine = KelivoTermuxMcpServerEngine(isSupported: () => false);
      addTearDown(engine.close);

      final response = await engine.handleMessage({
        'jsonrpc': '2.0',
        'id': 5,
        'method': 'tools/call',
        'params': {
          'name': 'termux_run_command',
          'arguments': {'command': 'pwd'},
        },
      }) as Map<String, dynamic>;
      final result = response['result'] as Map<String, dynamic>;

      expect(result['isError'], isTrue);
      expect(result['content'][0]['text'], contains('unsupported_platform'));
    });

    test('turns executor timeout into a stable MCP error', () async {
      final engine = KelivoTermuxMcpServerEngine(
        isSupported: () => true,
        executor: ({
          required command,
          required arguments,
          required workingDirectory,
          required background,
          required timeoutSeconds,
        }) => throw TimeoutException('late'),
      );
      addTearDown(engine.close);

      final response = await engine.handleMessage({
        'jsonrpc': '2.0',
        'id': 6,
        'method': 'tools/call',
        'params': {
          'name': 'termux_run_command',
          'arguments': {'command': 'sleep'},
        },
      }) as Map<String, dynamic>;
      final result = response['result'] as Map<String, dynamic>;

