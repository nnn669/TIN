    expect(
      () => TermuxCommand.run(
        command: 'echo',
        arguments: List<String>.filled(TermuxCommand.maxArguments + 1, 'x'),
        methodChannel: channel,
      ),
      throwsArgumentError,
    );
  });

  test('rejects timeout outside the bounded result window', () {
    expect(
      () => TermuxCommand.run(
        command: 'pwd',
        timeoutSeconds: TermuxCommand.maxTimeoutSeconds + 1,
        methodChannel: channel,
      ),
