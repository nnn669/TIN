name: Patch DeepSeek Thinking Budget

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    name: Patch openai_common DeepSeek branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply DeepSeek thinking budget_tokens patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/core/services/api/providers/openai_common.dart')
          src = path.read_text(encoding='utf-8')
          old = (
              "  } else if (info.isDeepSeek) {\n"
              "    if (isReasoning) {\n"
              "      body['thinking'] = {'type': off ? 'disabled' : 'enabled'};\n"
              "    } else {\n"
          )
          new = (
              "  } else if (info.isDeepSeek) {\n"
              "    if (isReasoning) {\n"
              "      body['thinking'] = <String, dynamic>{\n"
              "        'type': off ? 'disabled' : 'enabled',\n"
              "        if (!off && thinkingBudget != null && thinkingBudget > 0)\n"
              "          'budget_tokens': thinkingBudget,\n"
              "      };\n"
              "    } else {\n"
          )
          count = src.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly 1 match, got {count}')
          path.write_text(src.replace(old, new), encoding='utf-8')
          print('patched ok')
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TIN Bot'
          git config user.email 'actions@github.com'
          git add lib/core/services/api/providers/openai_common.dart
          git diff --cached --stat
          git commit -m 'fix(api): pass thinking budget_tokens for DeepSeek reasoning'
          git push origin HEAD:main
