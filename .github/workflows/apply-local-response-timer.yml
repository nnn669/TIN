name: Apply local response timer patch

on:
  push:
    branches:
      - feat/local-first-response-timer

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-first-response-timer
      - name: Apply exact patch
        run: python3 tool/apply_local_response_timer_patch.py
      - name: Remove one-time patch files
        run: rm tool/apply_local_response_timer_patch.py .github/workflows/apply-local-response-timer.yml
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(chat): add local first-response timer badge'
          git push origin feat/local-first-response-timer
