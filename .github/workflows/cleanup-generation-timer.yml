name: One-time cleanup generation timer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove extra generation timer
        shell: bash
        run: |
          set -euo pipefail
          sed -i "/import 'generation_timer_badge.dart';/d" lib/features/chat/widgets/chat_message_widget.dart
          rm -f lib/features/chat/widgets/generation_timer_badge.dart
          rm -f .github/workflows/cleanup-generation-timer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'revert(chat): remove extra generation timer'
          git push origin main