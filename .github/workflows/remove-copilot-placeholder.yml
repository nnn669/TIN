name: Remove Copilot Placeholder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove placeholder registration and migrate persisted configs
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/core/providers/mcp_provider.dart')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "import '../services/mcp/kelivo_copilot/kelivo_copilot_server.dart';\n",
                  '',
              ),
              (
                  "  static const String _builtinCopilotId = 'kelivo_copilot';\n"
                  "  static const String _builtinCopilotName = '@kelivo/copilot';\n",
                  "  static const String _removedCopilotId = 'kelivo_copilot';\n"
                  "  static const String _removedCopilotName = '@kelivo/copilot';\n",
              ),
              (
                  "    if (!_hasBuiltinServer(_builtinCopilotId, _builtinCopilotName)) {\n"
                  "      next.add(\n"
                  "        _builtinServer(_builtinCopilotId, _builtinCopilotName, enabled: false),\n"
                  "      );\n"
                  "    }\n",
                  '',
              ),
              (
                  "  bool _isBuiltinCopilotServer(McpServerConfig server) {\n"
                  "    return server.transport == McpTransportType.inmemory &&\n"
                  "        (server.id == _builtinCopilotId || server.name == _builtinCopilotName);\n"
                  "  }\n\n",
                  "  bool _isRemovedCopilotPlaceholder(McpServerConfig server) {\n"
                  "    return server.transport == McpTransportType.inmemory &&\n"
                  "        (server.id == _removedCopilotId ||\n"
                  "            server.name == _removedCopilotName);\n"
                  "  }\n\n",
              ),
              (
                  "        _isBuiltinGithubServer(server) ||\n"
                  "        _isBuiltinImagesServer(server) ||\n"
                  "        _isBuiltinCopilotServer(server);\n",
                  "        _isBuiltinGithubServer(server) ||\n"
                  "        _isBuiltinImagesServer(server);\n",
              ),
              (
                  "\n  bool isBuiltinCopilotServer(McpServerConfig server) {\n"
                  "    return _isBuiltinCopilotServer(server);\n"
                  "  }\n",
                  '',
              ),
              (
                  "    if (_isBuiltinCopilotServer(server)) {\n"
                  "      return KelivoCopilotMcpServerEngine();\n"
                  "    }\n",
                  '',
              ),
              (
                  "    _ensureBuiltinServersPresent();\n",
                  "    _servers = _servers\n"
                  "        .where((s) => !_isRemovedCopilotPlaceholder(s))\n"
                  "        .toList(growable: false);\n"
                  "    _ensureBuiltinServersPresent();\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'replacement expected once, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          old = "    _servers = List<McpServerConfig>.of(nextServers);\n"
          new = (
              "    final filteredServers = nextServers\n"
              "        .where((s) => !_isRemovedCopilotPlaceholder(s))\n"
              "        .toList(growable: false);\n"
              "    if (filteredServers.isEmpty) {\n"
              "      throw const FormatException('No valid MCP servers found in JSON');\n"
              "    }\n\n"
              "    _servers = List<McpServerConfig>.of(filteredServers);\n"
          )
          if text.count(old) != 1:
              raise SystemExit('replaceAllFromConfigs assignment not found exactly once')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Delete placeholder implementation and cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f lib/core/services/mcp/kelivo_copilot/kelivo_copilot_server.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/providers/mcp_provider.dart lib/core/services/mcp/kelivo_copilot/kelivo_copilot_server.dart .github/workflows/remove-copilot-placeholder.yml
          git commit -m "fix(mcp): remove empty copilot placeholder server"
          git push origin HEAD:main