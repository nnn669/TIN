name: Remove Copilot Placeholder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove all placeholder remnants
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/core/providers/mcp_provider.dart')
          text = path.read_text(encoding='utf-8')

          stale_branch = (
              "            } else if (id == _builtinCopilotId || name == _builtinCopilotName) {\n"
              "              builtinEnabledById[_builtinCopilotId] = enabled;\n"
          )
          if text.count(stale_branch) != 1:
              raise SystemExit(f'stale import branch expected once, got {text.count(stale_branch)}')
          text = text.replace(stale_branch, '', 1)

          stale_fallback = (
              "          next.add(\n"
              "            _builtinServer(\n"
              "              _builtinCopilotId,\n"
              "              _builtinCopilotName,\n"
              "              enabled: false,\n"
              "            ).copyWith(enabled: builtinEnabledById[_builtinCopilotId] ?? false),\n"
              "          );\n"
          )
          if text.count(stale_fallback) != 1:
              raise SystemExit(f'stale fallback expected once, got {text.count(stale_fallback)}')
          text = text.replace(stale_fallback, '', 1)

          if '_builtinCopilot' in text or 'KelivoCopilot' in text:
              raise SystemExit('stale copilot implementation references remain')

          path.write_text(text, encoding='utf-8')

      - name: Remove temporary cleanup workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/remove-copilot-placeholder.yml
          rm -f .github/workflows/finalize-copilot-removal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/providers/mcp_provider.dart .github/workflows/remove-copilot-placeholder.yml .github/workflows/finalize-copilot-removal.yml
          git commit -m "fix(mcp): finalize copilot placeholder cleanup"
          git push origin HEAD:main