name: Validate Termux MCP Patch

on:
  push:
    branches:
      - automation/termux-mcp-patch

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.44.1

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply provider and migration patch
        run: |
          set -euo pipefail
          python3 tools/normalize_termux_patch.py
          python3 tools/patch_termux_mcp.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies and run generators
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Format and analyze changed paths
        run: |
          set -euo pipefail
          dart format lib/core/services/termux_command.dart lib/core/services/mcp/kelivo_termux/kelivo_termux_server.dart lib/core/providers/mcp_provider.dart lib/features/home/services/local_tools_service.dart test/termux_command_test.dart test/kelivo_termux_mcp_server_test.dart test/termux_mcp_provider_test.dart
          flutter analyze lib/core/services/termux_command.dart lib/core/services/mcp/kelivo_termux/kelivo_termux_server.dart lib/core/providers/mcp_provider.dart lib/features/home/services/local_tools_service.dart test/termux_command_test.dart test/kelivo_termux_mcp_server_test.dart test/termux_mcp_provider_test.dart

      - name: Run related Flutter tests
        run: |
          set -euo pipefail
          flutter test test/termux_command_test.dart test/kelivo_termux_mcp_server_test.dart test/termux_mcp_provider_test.dart test/local_tools_service_test.dart test/mcp_lifecycle_reconnect_test.dart

      - name: Verify Android arm64 debug build
        run: |
          set -euo pipefail
          flutter build apk --debug --target-platform android-arm64

      - name: Commit validated patch
        run: |
          set -euo pipefail
          git rm -f .github/workflows/termux-mcp-validate.yml tools/patch_termux_mcp.py tools/normalize_termux_patch.py
          git config user.name 'TIN Bot'
          git config user.email 'actions@github.com'
          git add android/app/src/main/AndroidManifest.xml android/app/src/main/kotlin/com/psyche/tin/TermuxCommandHandler.kt android/app/src/main/kotlin/com/psyche/tin/TermuxCommandResultService.kt lib/core/providers/mcp_provider.dart lib/core/services/termux_command.dart lib/core/services/mcp/kelivo_termux/kelivo_termux_server.dart lib/features/home/services/local_tools_service.dart test/termux_command_test.dart test/kelivo_termux_mcp_server_test.dart test/termux_mcp_provider_test.dart test/termux_local_tool_test.dart .github/workflows/patch_deepseek_thinking.yml
          git diff --cached --check
          git commit -m 'feat(mcp): move Termux execution behind built-in server'
          git push origin HEAD:automation/termux-mcp-patch