name: Rollback Recent Chat Changes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Force main back to v1.1.51 baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GH_REPO}/git/refs/heads/main" \
            -f sha=151a6838f0ff77ce472d67e781e933ecb03bbdc5 \
            -F force=true
          echo "main moved to v1.1.51 baseline"