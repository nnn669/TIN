name: Restore Main To Latest Successful Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Force main to Android test build 644
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GH_REPO}/git/refs/heads/main" \
            -f sha=2154e2d758fa41ff8ef7ab643afd1d8e330966d4 \
            -F force=true
          echo "main moved to latest successful Android build 644"