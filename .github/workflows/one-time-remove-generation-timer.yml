name: One-time generation timer cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove stale timer call
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/chat/widgets/chat_message_widget.dart')
          text = path.read_text()
          old = '''                          const SizedBox(width: 6),
                          GenerationTimerBadge(
                            isStreaming: widget.message.isStreaming,
                            startTime: widget.message.timestamp,
                            durationMs: widget.message.durationMs,
                          ),
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale timer call, found {text.count(old)}')
          path.write_text(text.replace(old, ''))
          if 'GenerationTimerBadge' in path.read_text():
              raise SystemExit('stale GenerationTimerBadge reference remains')
          PY
          git rm .github/workflows/one-time-remove-generation-timer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/chat/widgets/one-time-remove-generation-timer.yml lib/features/chat/widgets/chat_message_widget.dart
          git commit -m 'fix(chat): remove stale generation timer call'
          git push origin HEAD:main