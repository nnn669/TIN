name: Temporary chat background inspection

on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        default: main
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Inspect home background call chain
        shell: bash
        run: |
          set +e
          find lib/features/home -type f -name '*.dart' | sort
          echo '=== assistant background references ==='
          grep -RIn --exclude='*.g.dart' -E 'assistant\.background|background.*assistant|backgroundPath|Image\.file|Image\.asset|DecorationImage|BoxFit' lib/features/home lib/features/chat | head -800