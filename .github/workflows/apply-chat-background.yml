      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate localization files
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
      - name: Check and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --short)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-chat-background.yml
          git add lib/core/providers/settings_provider.dart lib/features/settings/pages/display_settings_page.dart lib/features/home/pages/home_page.dart lib/l10n
          git commit -m "feat: import local chat background image"
          git push origin main