name: Apply Image Generation Routing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - name: Apply routing patch
        run: python3 tools/apply_image_generation_routing.py
      - name: Generate localization and format changed Dart
        run: |
          flutter gen-l10n
          dart format lib/core/services/image_generation_routing.dart lib/features/home/services/tool_handler_service.dart lib/features/home/controllers/generation_controller.dart lib/features/home/services/message_generation_service.dart lib/features/model/widgets/model_detail_sheet.dart test/core/services/image_generation_routing_test.dart
      - name: Analyze and test routing
        run: |
          flutter analyze lib/core/services/image_generation_routing.dart lib/features/home/services/tool_handler_service.dart lib/features/home/controllers/generation_controller.dart lib/features/home/services/message_generation_service.dart lib/features/model/widgets/model_detail_sheet.dart test/core/services/image_generation_routing_test.dart
          flutter test test/core/services/image_generation_routing_test.dart
      - name: Commit applied changes and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/services/image_generation_routing.dart lib/features/home/services/tool_handler_service.dart lib/features/home/controllers/generation_controller.dart lib/features/home/services/message_generation_service.dart lib/features/model/widgets/model_detail_sheet.dart lib/l10n/app_en.arb lib/l10n/app_zh.arb lib/l10n/app_zh_Hans.arb lib/l10n/app_zh_Hant.arb
          git rm .github/workflows/apply-image-generation-routing.yml
          git commit -m "feat: connect image generation routing to chat models"
          git push origin HEAD:main