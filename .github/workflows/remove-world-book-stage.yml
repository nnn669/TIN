name: Stage World Book Removal
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Generate cleanup branch
        shell: python
        run: |
          from pathlib import Path
          import subprocess, textwrap, json
          workflow=Path('.github/workflows/remove-world-book.yml').read_text(encoding='utf-8')
          block=workflow.split('      - name: Remove world book subsystem and references\n        shell: python\n        run: |\n',1)[1].split('      - name: Regenerate localization and format\n',1)[0]
          exec(textwrap.dedent(block), {'__name__':'__main__'})
          for p in Path('lib/l10n').glob('*.arb'):
              original=subprocess.check_output(['git','show',f'HEAD:{p.as_posix()}'],text=True)
              data=json.loads(original)
              data={k:v for k,v in data.items() if 'worldbook' not in k.lower()}
              p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Push staging branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B worldbook-removal-wip
          git add -A
          git commit -m "wip: generated world book removal"
          git push --force origin worldbook-removal-wip