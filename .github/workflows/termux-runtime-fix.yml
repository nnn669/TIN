name: Validate Termux Runtime Fix

on:
  push:
    branches:
      - fix/termux-mcp-runtime

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.44.1

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Apply fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_termux_runtime_fix.py')
          text = path.read_text()
          text = text.replace("'_builtinTermuxName',\n    'builtinTermuxName',\n    count=7,", "'_builtinTermuxName',\n    'builtinTermuxName',\n    count=5,")
          text = text.replace("    count=3,\n)\n\nreplace(\n    'lib/features/home/services/tool_handler_service.dart'", "    count=2,\n)\n\nreplace(\n    'lib/features/home/services/tool_handler_service.dart'")
          text += "\nfor file in [root / 'test/core/services/mcp/mcp_tool_service_test.dart']:\n    file.write_text(file.read_text().replace('package:Kelivo/', 'package:tin/'))\n"
          path.write_text(text)
          PY
          python3 tools/apply_termux_runtime_fix.py
      - name: Generate and format
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          dart format lib/core/providers/mcp_provider.dart lib/core/services/mcp/mcp_tool_service.dart lib/features/home/services/tool_handler_service.dart test/termux_mcp_provider_test.dart test/core/services/mcp/mcp_tool_service_test.dart
      - name: Analyze changed paths
        run: flutter analyze lib/core/providers/mcp_provider.dart lib/core/services/mcp/mcp_tool_service.dart lib/core/services/mcp/kelivo_termux/kelivo_termux_server.dart lib/core/services/termux_command.dart lib/features/home/services/tool_handler_service.dart test/termux_mcp_provider_test.dart test/core/services/mcp/mcp_tool_service_test.dart test/kelivo_termux_mcp_server_test.dart test/termux_command_test.dart
      - name: Run Termux regression tests
        run: flutter test test/termux_mcp_provider_test.dart test/core/services/mcp/mcp_tool_service_test.dart test/kelivo_termux_mcp_server_test.dart test/termux_command_test.dart
      - name: Compile Android arm64 debug APK
        run: flutter build apk --debug --target-platform android-arm64
      - name: Verify Termux Android contract
        run: |
          grep -F 'const val EXTRA_COMMAND_RESULT = "result"' android/app/src/main/kotlin/com/psyche/tin/TermuxCommandHandler.kt
          grep -F 'bundle.getInt("err", 0)' android/app/src/main/kotlin/com/psyche/tin/TermuxCommandHandler.kt
          grep -F 'activity.requestPermissions(arrayOf(TERMUX_PERMISSION)' android/app/src/main/kotlin/com/psyche/tin/TermuxCommandHandler.kt
          grep -F 'android:name="com.termux.permission.RUN_COMMAND"' android/app/src/main/AndroidManifest.xml
      - name: Commit validated fix
        run: |
          rm tools/apply_termux_runtime_fix.py .github/workflows/termux-runtime-fix.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "fix(mcp): make Termux tool callable on Android"
          git push origin HEAD:fix/termux-mcp-runtime
