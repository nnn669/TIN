name: Apply provider group display patch

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to patch
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Apply provider grouping display patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/features/model/widgets/model_select_sheet.dart')
          source = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              source = source.replace(old, new, 1)

          replace_once(
              """    final l10n = AppLocalizations.of(context)!;
    final query = _search.text.trim();
""",
              """    final l10n = AppLocalizations.of(context)!;
    final settings = context.watch<SettingsProvider>();
    final query = _search.text.trim();
    String providerGroupKey(String providerKey) =>
        settings.groupIdForProvider(providerKey) ??
        SettingsProvider.providerUngroupedGroupKey;
    String providerGroupTitle(String providerKey) {
      final groupId = settings.groupIdForProvider(providerKey);
      return groupId == null
          ? l10n.providerGroupsOther
          : (settings.groupById(groupId)?.name ?? l10n.providerGroupsOther);
    }
    String? lastProviderGroupKey;
""",
              'mobile grouping state',
          )

          replace_once(
              """      _headerIndexMap[pk] = _rows.length;
      _rows.add(_HeaderRow(g.name, providerKey: pk));
""",
              """      if (widget.limitProviderKey == null) {
        final groupKey = providerGroupKey(pk);
        if (groupKey != lastProviderGroupKey) {
          _rows.add(
            _ProviderGroupHeaderRow(providerGroupTitle(pk)),
          );
          lastProviderGroupKey = groupKey;
        }
      }
      _headerIndexMap[pk] = _rows.length;
      _rows.add(_HeaderRow(g.name, providerKey: pk));
""",
              'mobile grouping rows',
          )

          replace_once(
              """                if (row is _HeaderRow) {
                  return _sectionHeader(
""",
              """                if (row is _ProviderGroupHeaderRow) {
                  return _providerGroupHeader(context, row.title);
                } else if (row is _HeaderRow) {
                  return _sectionHeader(
""",
              'mobile grouping rendering',
          )

          replace_once(
              """  Widget _sectionHeader(
""",
              """  Widget _providerGroupHeader(BuildContext context, String title) {
    final cs = Theme.of(context).colorScheme;
    return Padding(
      padding: const EdgeInsets.fromLTRB(16, 12, 16, 4),
      child: Text(
        title,
        maxLines: 1,
        overflow: TextOverflow.ellipsis,
        style: TextStyle(
          fontSize: 13,
          fontWeight: AppFontWeights.emphasis,
          color: cs.onSurface.withValues(alpha: 0.8),
        ),
      ),
    );
  }

  Widget _sectionHeader(
""",
              'mobile grouping header widget',
          )

          replace_once(
              """class _HeaderRow extends _ListRow {
  final String title;
  final String? providerKey;
  final bool isFavorites;
  _HeaderRow(this.title, {this.providerKey, this.isFavorites = false});
}
""",
              """class _ProviderGroupHeaderRow extends _ListRow {
  final String title;
  _ProviderGroupHeaderRow(this.title);
}

class _HeaderRow extends _ListRow {
  final String title;
  final String? providerKey;
  final bool isFavorites;
  _HeaderRow(this.title, {this.providerKey, this.isFavorites = false});
}
""",
              'group row type',
          )

          replace_once(
              """    final query = _searchCtrl.text.trim();
    _rows.clear();
""",
              """    final query = _searchCtrl.text.trim();
    String providerGroupKey(String providerKey) =>
        settings.groupIdForProvider(providerKey) ??
        SettingsProvider.providerUngroupedGroupKey;
    String providerGroupTitle(String providerKey) {
      final groupId = settings.groupIdForProvider(providerKey);
      return groupId == null
          ? l10n.providerGroupsOther
          : (settings.groupById(groupId)?.name ?? l10n.providerGroupsOther);
    }
    String? lastProviderGroupKey;
    _rows.clear();
""",
              'desktop grouping state',
          )

          replace_once(
              """      // When limiting to a single provider, hide the provider header (and its settings button)
      if (widget.limitProviderKey == null) {
""",
              """      // When limiting to a single provider, hide the provider header (and its settings button)
      if (widget.limitProviderKey == null) {
        final groupKey = providerGroupKey(pk);
        if (groupKey != lastProviderGroupKey) {
          _rows.add(_ProviderGroupHeaderRow(providerGroupTitle(pk)));
          lastProviderGroupKey = groupKey;
        }
""",
              'desktop grouping rows',
          )

          replace_once(
              """        if (row is _HeaderRow) {
          if (row.isFavorites) {
            return _favoritesHeader(context, row.title);
          }
          return _providerHeader(context, row.providerKey, row.title);
""",
              """        if (row is _ProviderGroupHeaderRow) {
          return _providerGroupHeader(context, row.title);
        } else if (row is _HeaderRow) {
          if (row.isFavorites) {
            return _favoritesHeader(context, row.title);
          }
          return _providerHeader(context, row.providerKey, row.title);
""",
              'desktop grouping rendering',
          )

          replace_once(
              """  Widget _providerHeader(
""",
              """  Widget _providerGroupHeader(BuildContext context, String title) {
    final cs = Theme.of(context).colorScheme;
    return Padding(
      padding: const EdgeInsets.fromLTRB(14, 10, 14, 3),
      child: Text(
        title,
        maxLines: 1,
        overflow: TextOverflow.ellipsis,
        style: TextStyle(
          fontSize: 12,
          fontWeight: AppFontWeights.emphasis,
          color: cs.onSurface.withValues(alpha: 0.8),
        ),
      ),
    );
  }

  Widget _providerHeader(
""",
              'desktop grouping header widget',
          )

          path.write_text(source, encoding='utf-8')
          print(f'patched {path}')
          PY

      - name: Static source validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/model/widgets/model_select_sheet.dart')
          s = p.read_text(encoding='utf-8')
          required = [
              'class _ProviderGroupHeaderRow extends _ListRow',
              'providerGroupKey(String providerKey)',
              'Widget _providerGroupHeader(BuildContext context, String title)',
              'SettingsProvider.providerUngroupedGroupKey',
          ]
          for marker in required:
              assert marker in s, marker
          assert s.count('class _ProviderGroupHeaderRow extends _ListRow') == 1
          assert s.count('providerGroupKey(String providerKey)') == 2
          assert s.count('_ProviderGroupHeaderRow(providerGroupTitle(pk))') == 2
          assert s.count('Widget _providerGroupHeader(BuildContext context, String title)') == 2
          print('provider grouping source checks passed')
          PY
          git diff --check

      - name: Commit target source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/model/widgets/model_select_sheet.dart
          git commit -m 'feat: show provider groups in model selector'
          git push origin HEAD:${{ inputs.target_branch }}