name: Copilot Batch 3 Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply batch 3 changes
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/core/providers/mcp_provider.dart')
          text = path.read_text(encoding='utf-8')
          old = (
              "    if (_isBuiltinGithubServer(server)) {\n"
              "      return KelivoGithubMcpServerEngine(\n"
              "        client: GitHubApiClient(accessTokenProvider: () async => _githubToken),\n"
              "      );\n"
              "    }\n"
              "    return KelivoFetchMcpServerEngine();\n"
          )
          new = (
              "    if (_isBuiltinGithubServer(server)) {\n"
              "      return KelivoGithubMcpServerEngine(\n"
              "        client: GitHubApiClient(accessTokenProvider: () async => _githubToken),\n"
              "      );\n"
              "    }\n"
              "    if (_isBuiltinCopilotServer(server)) {\n"
              "      return KelivoCopilotMcpServerEngine();\n"
              "    }\n"
              "    return KelivoFetchMcpServerEngine();\n"
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one match, got {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/copilot-batch-3.yml
          git add lib/core/providers/mcp_provider.dart .github/workflows/copilot-batch-3.yml
          git commit -m "feat: route copilot to its built-in engine"
          git push origin "HEAD:${GITHUB_REF_NAME}"