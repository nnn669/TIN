name: Fix tool timeline visibility

on:
  push:
    branches:
      - remove-world-book
    paths:
      - 'tools/fix_tool_timeline_visibility.py'
      - '.github/workflows/fix-tool-timeline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted fixes
        run: python3 tools/fix_tool_timeline_visibility.py
      - name: Validate targeted source patterns
        run: |
          ! grep -n "toolGroup" test/features/assistant/assistant_edit_tab_layout_test.dart
          grep -n "LocalToolNames.textToSpeech" lib/features/chat/widgets/chat_message_widget.dart
          grep -n "groupedTools.length == 1" lib/features/chat/widgets/chat_message_widget.dart
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/chat/widgets/chat_message_widget.dart test/features/assistant/assistant_edit_tab_layout_test.dart
          git diff --cached --quiet || git commit -m "fix: keep interactive tool timeline items visible"
          git push
