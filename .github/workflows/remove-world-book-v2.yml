name: Remove World Book V2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - name: Apply cleanup script
        shell: python
        run: |
          from pathlib import Path
          import subprocess, textwrap, json
          workflow=Path('.github/workflows/remove-world-book.yml').read_text(encoding='utf-8')
          block=workflow.split('      - name: Remove world book subsystem and references\n        shell: python\n        run: |\n',1)[1].split('      - name: Regenerate localization and format\n',1)[0]
          exec(textwrap.dedent(block), {'__name__':'__main__'})
          for p in Path('lib/l10n').glob('*.arb'):
              original=subprocess.check_output(['git','show',f'HEAD:{p.as_posix()}'],text=True)
              data=json.loads(original)
              data={k:v for k,v in data.items() if 'worldbook' not in k.lower()}
              p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Regenerate localization and format
        run: |
          flutter pub get
          flutter gen-l10n
          dart format lib test
      - name: Verify removal
        run: |
          if git grep -inE 'world.?book|世界书' -- ':!PROGRESS.md' ':!.github/workflows/remove-world-book.yml' ':!.github/workflows/remove-world-book-v2.yml'; then
            echo 'World book references remain' >&2
            exit 1
          fi
          flutter analyze
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/remove-world-book.yml .github/workflows/remove-world-book-v2.yml
          git add -A
          git commit -m "feat: remove world book feature completely"
          git push origin main