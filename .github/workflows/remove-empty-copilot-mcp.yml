name: Remove Empty Copilot MCP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Remove obsolete built-in MCP implementation
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/core/providers/mcp_provider.dart')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "import '../services/mcp/kelivo_copilot/kelivo_copilot_server.dart';\n",
                  "",
              ),
              (
                  "  static const String _builtinCopilotId = 'kelivo_copilot';\n"
                  "  static const String _builtinCopilotName = '@kelivo/copilot';\n",
                  "",
              ),
              (
                  "    _ensureBuiltinServersPresent();\n"
                  "    // initialize statuses\n",
                  "    final removedLegacyCopilot = _removeLegacyCopilotServers();\n"
                  "    _ensureBuiltinServersPresent();\n"
                  "    if (removedLegacyCopilot) {\n"
                  "      await _persist();\n"
                  "    }\n"
                  "    // initialize statuses\n",
              ),
              (
                  "    if (!_hasBuiltinServer(_builtinCopilotId, _builtinCopilotName)) {\n"
                  "      next.add(\n"
                  "        _builtinServer(_builtinCopilotId, _builtinCopilotName, enabled: false),\n"
                  "      );\n"
                  "    }\n",
                  "",
              ),
              (
                  "  bool _isBuiltinCopilotServer(McpServerConfig server) {\n"
                  "    return server.transport == McpTransportType.inmemory &&\n"
                  "        (server.id == _builtinCopilotId || server.name == _builtinCopilotName);\n"
                  "  }\n\n",
                  "  bool _isLegacyBuiltinCopilotServer(McpServerConfig server) {\n"
                  "    return server.transport == McpTransportType.inmemory &&\n"
                  "        (server.id == 'kelivo_copilot' ||\n"
                  "            server.name == '@kelivo/copilot');\n"
                  "  }\n\n"
                  "  bool _removeLegacyCopilotServers() {\n"
                  "    final retained = _servers\n"
                  "        .where((server) => !_isLegacyBuiltinCopilotServer(server))\n"
                  "        .toList(growable: false);\n"
                  "    if (retained.length == _servers.length) return false;\n"
                  "    _servers = retained;\n"
                  "    return true;\n"
                  "  }\n\n",
              ),
              (
                  "        _isBuiltinGithubServer(server) ||\n"
                  "        _isBuiltinImagesServer(server) ||\n"
                  "        _isBuiltinCopilotServer(server);\n",
                  "        _isBuiltinGithubServer(server) ||\n"
                  "        _isBuiltinImagesServer(server);\n",
              ),
              (
                  "  bool isBuiltinCopilotServer(McpServerConfig server) {\n"
                  "    return _isBuiltinCopilotServer(server);\n"
                  "  }\n\n",
                  "",
              ),
              (
                  "    if (_isBuiltinCopilotServer(server)) {\n"
                  "      return KelivoCopilotMcpServerEngine();\n"
                  "    }\n",
                  "",
              ),
              (
                  "            } else if (id == _builtinCopilotId || name == _builtinCopilotName) {\n"
                  "              builtinEnabledById[_builtinCopilotId] = enabled;\n"
                  "            } else if (id == _builtinFetchId || name == _builtinFetchName) {\n",
                  "            } else if (id == 'kelivo_copilot' || name == '@kelivo/copilot') {\n"
                  "              continue;\n"
                  "            } else if (id == _builtinFetchId || name == _builtinFetchName) {\n",
              ),
              (
                  "          next.add(\n"
                  "            _builtinServer(\n"
                  "              _builtinCopilotId,\n"
                  "              _builtinCopilotName,\n"
                  "              enabled: false,\n"
                  "            ).copyWith(enabled: builtinEnabledById[_builtinCopilotId] ?? false),\n"
                  "          );\n",
                  "",
              ),
              (
                  "  Future<void> replaceAllFromConfigs(List<McpServerConfig> nextServers) async {\n"
                  "    if (nextServers.isEmpty) {\n"
                  "      throw const FormatException('No valid MCP servers found in JSON');\n"
                  "    }\n\n"
                  "    // Disconnect all current\n",
                  "  Future<void> replaceAllFromConfigs(List<McpServerConfig> nextServers) async {\n"
                  "    final sanitizedNextServers = nextServers\n"
                  "        .where((server) => !_isLegacyBuiltinCopilotServer(server))\n"
                  "        .toList(growable: false);\n"
                  "    if (sanitizedNextServers.isEmpty) {\n"
                  "      throw const FormatException('No valid MCP servers found in JSON');\n"
                  "    }\n\n"
                  "    // Disconnect all current\n",
              ),
              (
                  "    _servers = List<McpServerConfig>.of(nextServers);\n",
                  "    _servers = List<McpServerConfig>.of(sanitizedNextServers);\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one matching source fragment, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          Path('lib/core/services/mcp/kelivo_copilot/kelivo_copilot_server.dart').unlink()
      - name: Commit removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/remove-empty-copilot-mcp.yml
          git add lib/core/providers/mcp_provider.dart lib/core/services/mcp/kelivo_copilot/kelivo_copilot_server.dart .github/workflows/remove-empty-copilot-mcp.yml
          git commit -m 'fix(mcp): remove obsolete empty Copilot server'
          git push origin "HEAD:${GITHUB_REF_NAME}"