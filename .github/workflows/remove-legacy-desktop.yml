name: remove-legacy-desktop

on: [workflow_dispatch]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove legacy desktop implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def block_end(text, brace):
              depth = 0
              i = brace
              state = None
              triple = False
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ''
                  if state == 'line':
                      if c == '\n': state = None
                      i += 1
                      continue
                  if state == 'block':
                      if c == '*' and n == '/': state = None; i += 2; continue
                      i += 1
                      continue
                  if state in ("'", '"'):
                      if triple:
                          if text.startswith(state * 3, i):
                              state = None; triple = False; i += 3; continue
                          i += 1; continue
                      if c == '\\': i += 2; continue
                      if c == state: state = None
                      i += 1
                      continue
                  if c == '/' and n == '/': state = 'line'; i += 2; continue
                  if c == '/' and n == '*': state = 'block'; i += 2; continue
                  if c in ("'", '"'):
                      state = c
                      triple = text.startswith(c * 3, i)
                      i += 3 if triple else 1
                      continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0: return i + 1
                  i += 1
              raise RuntimeError('unbalanced block')

          def remove_block(text, marker, start_at=0):
              start = text.find(marker, start_at)
              if start < 0: return text
              brace = text.find('{', start)
              if brace < 0: raise RuntimeError(f'opening brace not found: {marker}')
              end = block_end(text, brace)
              line_start = text.rfind('\n', 0, start) + 1
              return text[:line_start] + text[end:]

          def replace_method(text, marker, replacement, start_at=0):
              start = text.find(marker, start_at)
              if start < 0: raise RuntimeError(f'method not found: {marker}')
              brace = text.find('{', start)
              end = block_end(text, brace)
              line_start = text.rfind('\n', 0, start) + 1
              return text[:line_start] + replacement.rstrip() + text[end:]

          # main.dart: Android is the only native target now.
          p = Path('lib/main.dart')
          text = p.read_text()
          for needle in [
              "import 'dart:io' show Platform;\n",
              "import 'package:system_fonts/system_fonts.dart';\n",
              "import 'package:window_manager/window_manager.dart';\n",
              "import 'desktop/desktop_home_page.dart';\n",
              "import 'desktop/desktop_tray_controller.dart';\n",
              "import 'desktop/desktop_window_controller.dart';\n",
              "import 'core/providers/hotkey_provider.dart';\n",
          ]:
              text = text.replace(needle, '')
          text = text.replace('      await _initDesktopWindow();\n', '')
          text = text.replace('        ChangeNotifierProvider(create: (_) => HotkeyProvider()),\n', '')
          text = remove_block(text, 'Future<void> _initDesktopWindow() async')
          text = remove_block(text, 'bool get isDesktopPlatform')
          text = remove_block(text, '  void _scheduleDesktopFontLoads(SettingsProvider settings)')
          text = remove_block(text, '  void _scheduleDesktopHotkeyInit()')
          text = remove_block(text, '  void _scheduleDesktopTraySync(BuildContext ctx)')
          text = text.replace('  final SystemFonts _systemFonts = SystemFonts();\n  final Set<String> _loadedSystemFonts = <String>{};\n\n', '')
          text = text.replace('  bool _didInitDesktopHotkeys = false;\n', '')
          text = text.replace('  String? _lastTraySyncKey;\n', '')
          text = text.replace('    _scheduleDesktopFontLoads(settings);\n', '')
          text = text.replace('        _scheduleDesktopHotkeyInit();\n', '')
          text = text.replace('            _scheduleDesktopTraySync(ctx);\n', '')
          text = text.replace('  return isDesktopPlatform ? const DesktopHomePage() : const HomePage();', '  return const HomePage();')
          text = text.replace('bool get isAndroidPlatform => !kIsWeb && Platform.isAndroid;', 'bool get isAndroidPlatform => !kIsWeb && defaultTargetPlatform == TargetPlatform.android;')
          p.write_text(text)

          # home_page.dart: retain the mobile UI and mobile sheets only.
          p = Path('lib/features/home/pages/home_page.dart')
          text = p.read_text()
          for needle in [
              "import 'package:desktop_drop/desktop_drop.dart';\n",
              "import '../../../desktop/search_provider_popover.dart';\n",
              "import '../../../desktop/reasoning_budget_popover.dart';\n",
              "import '../../../desktop/mcp_servers_popover.dart';\n",
              "import '../../../desktop/mini_map_popover.dart';\n",
              "import '../../../desktop/quick_phrase_popover.dart';\n",
              "import '../../../desktop/instruction_injection_popover.dart';\n",
              "import '../../../shared/responsive/breakpoints.dart';\n",
              "import 'home_desktop_layout.dart';\n",
              "import '../utils/chat_layout_constants.dart';\n",
          ]:
              text = text.replace(needle, '')
          state_start = text.find('class _HomePageState')
          build_replacement = '''  @override
  Widget build(BuildContext context) {
    final cs = Theme.of(context).colorScheme;
    final settings = context.watch<SettingsProvider>();
    final assistant = context.watch<AssistantProvider>().currentAssistant;
    final modelInfo = getModelDisplayInfo(settings, assistant: assistant);
    final title = _controller.isTemporaryConversation
        ? AppLocalizations.of(context)!.temporaryChatTitle
        : ((_controller.currentConversation?.title ?? '').trim().isNotEmpty)
            ? _controller.currentConversation!.title
            : _controller.titleForLocale();

    return _buildMobileLayout(
      context,
      title: title,
      providerName: modelInfo.providerName,
      modelDisplay: modelInfo.modelDisplay,
      cs: cs,
    );
  }
'''
          text = replace_method(text, '  Widget build(BuildContext context) {', build_replacement, state_start)
          text = remove_block(text, '  Widget _buildTabletLayout(', state_start)
          text = remove_block(text, '  Widget _buildTabletBody(', state_start)
          text = remove_block(text, '  Widget _buildAssistantBackground(', state_start)
          text = remove_block(text, '  Widget _wrapWithDropTarget(', state_start)
          text = replace_method(text, '  Future<void> _openSelectionMiniMap() async', '''  Future<void> _openSelectionMiniMap() async {
    final collapsed = _controller.allCollapsedMessagesForCurrentConversation();
    if (collapsed.isEmpty) return;
    await showMiniMapSheet(
      context,
      collapsed,
      selecting: true,
      selectedMessageIds: _controller.selectedItems,
      selectionListenable: _controller,
      onToggleSelection: (id) => _controller.toggleSelection(
        id,
        !_controller.selectedItems.contains(id),
      ),
    );
  }
''', state_start)
          text = replace_method(text, '  Future<void> _openMiniMap() async', '''  Future<void> _openMiniMap() async {
    final collapsed = _controller.allCollapsedMessagesForCurrentConversation();
    if (collapsed.isEmpty) return;
    final selectedId = await showMiniMapSheet(context, collapsed);
    if (!mounted) return;
    if (selectedId != null && selectedId.isNotEmpty) {
      await _controller.scrollToMessageId(selectedId);
    }
  }
''', state_start)
          text = replace_method(text, '  Widget _buildScrollButtons()', '''  Widget _buildScrollButtons() {
    return Builder(
      builder: (context) {
        final settings = context.watch<SettingsProvider>();
        if (_controller.selecting || _controller.messages.isEmpty) {
          return const SizedBox.shrink();
        }
        var visible = _controller.scrollCtrl.showNavButtons;
        switch (settings.mobileMessageNavButtonsMode) {
          case MobileMessageNavButtonsMode.always:
            visible = true;
            break;
          case MobileMessageNavButtonsMode.scroll:
            break;
          case MobileMessageNavButtonsMode.never:
            return const SizedBox.shrink();
        }
        return ScrollNavButtonsPanel(
          visible: visible,
          hoverEnabled: false,
          bottomOffset: _controller.inputBarHeight + 12,
          onScrollToTop: _controller.scrollToTop,
          onPreviousMessage: _controller.jumpToPreviousQuestion,
          onNextMessage: _controller.jumpToNextQuestion,
          onScrollToBottom: _controller.forceScrollToBottom,
        );
      },
    );
  }
''', state_start)
          text = text.replace('body: _wrapWithDropTarget(_buildMobileBody(context, cs)),', 'body: _buildMobileBody(context, cs),')
          text = text.replace('body: _wrapWithDropTarget(_buildTabletBody(context, cs)),', 'body: _buildMobileBody(context, cs),')
          text = text.replace('onCompressContext: _handleDesktopCompressContext,', 'onCompressContext: _handleCompressContext,')
          text = text.replace('  void _handleDesktopCompressContext() async {', '  void _handleCompressContext() async {')
          text = replace_method(text, '  void _openSearchSettings()', '''  void _openSearchSettings() {
    showSearchSettingsSheet(context);
  }
''', state_start)
          text = replace_method(text, '  Future<void> _openReasoningSettings() async', '''  Future<void> _openReasoningSettings() async {
    await showReasoningBudgetSheet(context);
  }
''', state_start)
          text = replace_method(text, '  Future<void> _openInstructionInjectionPopover() async', '''  Future<void> _openInstructionInjectionPopover() async {
    final assistantId = context.read<AssistantProvider>().currentAssistantId;
    final provider = context.read<InstructionInjectionProvider>();
    await provider.initialize();
    if (!mounted) return;
    if (provider.items.isEmpty) return;
    await showInstructionInjectionSheet(context, assistantId: assistantId);
  }
''', state_start)
          text = replace_method(text, '  Future<void> _showQuickPhraseMenu() async', '''  Future<void> _showQuickPhraseMenu() async {
    final assistant = context.read<AssistantProvider>().currentAssistant;
    final quickPhraseProvider = context.read<QuickPhraseProvider>();
    final globalPhrases = quickPhraseProvider.globalPhrases;
    final assistantPhrases = assistant != null
        ? quickPhraseProvider.getForAssistant(assistant.id)
        : <QuickPhrase>[];
    final allAvailable = [...globalPhrases, ...assistantPhrases];
    if (allAvailable.isEmpty) return;
    final inputBox = _inputBarKey.currentContext?.findRenderObject() as RenderBox?;
    if (inputBox == null) return;
    final topLeft = inputBox.localToGlobal(Offset.zero);
    final position = Offset(topLeft.dx, inputBox.size.height);
    _controller.dismissKeyboard();
    final selected = await showQuickPhraseMenu(
      context: context,
      phrases: allAvailable,
      position: position,
    );
    if (selected != null && mounted) {
      await _controller.handleQuickPhraseSelection(selected);
    }
  }
''', state_start)
          marker = '      onOpenMcp: () {'
          pos = text.find(marker, state_start)
          if pos >= 0:
              brace = text.find('{', pos)
              end = block_end(text, brace)
              comma = text.find(',', end)
              text = text[:pos] + '''      onOpenMcp: () {
        final a = context.read<AssistantProvider>().currentAssistant;
        if (a != null) {
          showAssistantMcpSheet(context, assistantId: a.id);
        }
      }''' + text[comma:]
          p.write_text(text)

          # home_page_controller.dart: remove desktop-only state, event buses and branches.
          p = Path('lib/features/home/controllers/home_page_controller.dart')
          text = p.read_text()
          for needle in [
              "import '../../../desktop/message_edit_dialog.dart';\n",
              "import '../../../desktop/hotkeys/chat_action_bus.dart';\n",
              "import '../../../desktop/hotkeys/sidebar_tab_bus.dart';\n",
          ]:
              text = text.replace(needle, '')
          text = text.replace('  McpProvider? _mcpProvider;\n  StreamSubscription<ChatAction>? _chatActionSub;\n', '  McpProvider? _mcpProvider;\n')
          text = text.replace('  // Desktop drag-and-drop\n  bool _isDragHovering = false;\n', '')
          text = text.replace('  // Sidebar state (tablet/desktop)\n  bool _tabletSidebarOpen = true;\n  bool _rightSidebarOpen = true;\n  double _embeddedSidebarWidth = 300;\n  double _rightSidebarWidth = 300;\n  bool _desktopUiInited = false;\n', '')
          text = text.replace('  bool get isDragHovering => _isDragHovering;\n  bool get tabletSidebarOpen => _tabletSidebarOpen;\n  bool get rightSidebarOpen => _rightSidebarOpen;\n  double get embeddedSidebarWidth => _embeddedSidebarWidth;\n  double get rightSidebarWidth => _rightSidebarWidth;\n  bool get desktopUiInited => _desktopUiInited;\n', '')
          text = text.replace('  static double get sidebarMinWidth => _sidebarMinWidth;\n  static double get sidebarMaxWidth => _sidebarMaxWidth;\n', '')
          text = text.replace('  bool get isDesktopPlatform => PlatformUtils.isDesktopTarget;\n\n', '')
          text = text.replace('    _setupDesktopFeatures();\n', '')
          text = remove_block(text, '  void _setupDesktopFeatures()', text.find('class HomePageController'))
          text = remove_block(text, '  void initDesktopUi()', text.find('class HomePageController'))
          text = replace_method(text, '  Future<void> switchConversationAnimated(String id) async', '''  Future<void> switchConversationAnimated(String id) async {
    try {
      await _viewModel.flushCurrentConversationProgress();
    } catch (_) {}
    if (currentConversation?.id == id) return;
    _exitUserMessageEdit(clearDraft: true);
    try {
      await _convoFadeController.reverse();
    } catch (_) {}
    await _viewModel.switchConversation(id);
    _scrollCtrl.clearObserverCache();
    notifyListeners();
    try {
      await WidgetsBinding.instance.endOfFrame;
    } catch (_) {}
    _scrollToBottom(animate: false);
    try {
      await _convoFadeController.forward();
    } catch (_) {}
  }
''', text.find('class HomePageController'))
          text = replace_method(text, '  Future<void> createNewConversationAnimated() async', '''  Future<void> createNewConversationAnimated() async {
    try {
      await _viewModel.flushCurrentConversationProgress();
    } catch (_) {}
    _exitUserMessageEdit(clearDraft: true);
    try {
      await _convoFadeController.reverse();
    } catch (_) {}
    await _createNewConversation();
    _scrollCtrl.clearObserverCache();
    try {
      await _convoFadeController.forward();
    } catch (_) {}
  }
''', text.find('class HomePageController'))
          text = replace_method(text, '  Future<void> forkConversation(ChatMessage message) async', '''  Future<void> forkConversation(ChatMessage message) async {
    if (currentConversation == null) return;
    await _convoFadeController.reverse();
    await _viewModel.forkConversation(message);
    notifyListeners();
    try {
      await WidgetsBinding.instance.endOfFrame;
    } catch (_) {}
    _scrollToBottom(animate: false);
    await _convoFadeController.forward();
  }
''', text.find('class HomePageController'))
          text = replace_method(text, '  Future<void> editMessage(ChatMessage message) async', '''  Future<void> editMessage(ChatMessage message) async {
    if (message.role == 'user') {
      await startUserMessageEdit(message);
      return;
    }
    final ctx = _context;
    if (!ctx.mounted) return;
    final result = await showMessageEditSheet(ctx, message: message);
    if (result == null) return;
    if (currentConversation != null) {
      await _chatService.clearConversationSuggestions(currentConversation!.id);
      _viewModel.updateCurrentConversation(
        _chatService.getConversation(currentConversation!.id),
      );
    }
    final newMsg = await _chatService.appendMessageVersion(
      messageId: message.id,
      content: result.content,
    );
    if (newMsg == null) return;
    if (_chatController.appendPersistedTailMessage(newMsg)) {
      _viewModel.restoreMessageUiState();
    }
    final gid = newMsg.groupId ?? newMsg.id;
    versionSelections[gid] = newMsg.version;
    notifyListeners();
    if (currentConversation != null) {
      try {
        await _chatService.setSelectedVersion(
          currentConversation!.id,
          gid,
          newMsg.version,
        );
      } catch (_) {}
    }
    if (result.shouldSend && message.role == 'assistant') {
      await regenerateAtMessage(newMsg, assistantAsNewReply: true);
    }
  }
''', text.find('class HomePageController'))
          text = remove_block(text, '  void setDragHovering(bool hovering)', text.find('class HomePageController'))
          text = remove_block(text, '  // ============================================================================\n  // Public Methods - Sidebar Management', text.find('class HomePageController'))
          text = remove_block(text, '  Future onFilesDroppedDesktop(', text.find('class HomePageController'))
          tts_marker = '    if (PlatformUtils.isDesktopTarget) {'
          tts_pos = text.find(tts_marker, text.find('Future<void> _speakAssistantMessage'))
          if tts_pos >= 0:
              brace = text.find('{', tts_pos)
              end = block_end(text, brace)
              text = text[:tts_pos] + text[end:]
          text = replace_method(text, '  void onDidPopNext()', '''  void onDidPopNext() {
    WidgetsBinding.instance.addPostFrameCallback((_) => dismissKeyboard());
  }
''', text.find('class HomePageController'))
          text = text.replace('    try { _chatActionSub?.cancel(); } catch (_) {}\n', '')
          p.write_text(text)

          # pubspec.yaml: remove desktop-only packages and assets.
          p = Path('pubspec.yaml')
          text = p.read_text()
          for dep in [
              '  bitsdojo_window: ^0.1.6\n',
              '  window_manager: ^0.5.1\n',
              '  screen_retriever: ^0.2.0\n',
              '  tray_manager:\n    path: ./dependencies/tray_manager\n',
              '  desktop_drop: ^0.7.1\n',
              '  hotkey_manager: ^0.2.3\n',
              '  webview_windows: ^0.4.0\n',
          ]:
              text = text.replace(dep, '')
          text = re.sub(r'\ndependency_overrides:\n  permission_handler_windows:\n    path: ./dependencies/flutter-permission-handler/permission_handler_windows\n', '\n', text)
          text = text.replace('    - assets/app_icon.ico\n', '').replace('    - assets/icon_mac.png\n', '')
          p.write_text(text)

          # Remove obsolete one-off workflow and desktop-only tests.
          obsolete = Path('.github/workflows/cleanup-desktop-theme-palette.yml')
          if obsolete.exists(): obsolete.unlink()
          for path in Path('test').glob('desktop_*.dart'):
              path.unlink()

          forbidden = [
              'package:desktop_drop',
              'package:window_manager',
              'package:hotkey_manager',
              'package:tray_manager',
              'package:bitsdojo_window',
              'package:screen_retriever',
              'DesktopHomePage',
              'HomeDesktopScaffold',
              'showDesktop',
              'DesktopWindowController',
              'DesktopTrayController',
              'HotkeyProvider',
          ]
          source = '\n'.join(str(p.read_text()) for p in Path('lib').rglob('*.dart'))
          remaining = [needle for needle in forbidden if needle in source]
          if remaining:
              raise SystemExit('desktop references remain: ' + ', '.join(remaining))
          if 'desktop_drop:' in Path('pubspec.yaml').read_text():
              raise SystemExit('desktop dependency remains in pubspec')
          PY

          git rm -r --ignore-unmatch lib/desktop dependencies/tray_manager dependencies/flutter-permission-handler/permission_handler_windows
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: remove legacy desktop implementation"
          git push

      - name: Remove this cleanup workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch .github/workflows/remove-legacy-desktop.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: remove one-off desktop cleanup workflow"
          git push