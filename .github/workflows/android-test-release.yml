name: Android Test Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_name:
        description: Optional version name override
        required: false
        type: string
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-test-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.1

jobs:
  pull-request-check:
    name: Flutter check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos

  android-release:
    name: Signed Android prerelease
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Calculate Android version code
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION_CODE=$(sed -nE 's/^version: [^+]+\+([0-9]+)\s*$/\1/p' pubspec.yaml | head -n 1)
          test -n "$BASE_VERSION_CODE"
          VERSION_CODE=$((BASE_VERSION_CODE + GITHUB_RUN_NUMBER))
          test "$VERSION_CODE" -gt "$BASE_VERSION_CODE"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Building versionCode=${VERSION_CODE} from base=${BASE_VERSION_CODE} and run=${GITHUB_RUN_NUMBER}"

      - name: Prepare release keystore
        shell: bash
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          SIGN_STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$SIGN_KEYSTORE_BASE64" && -n "$SIGN_STORE_PASSWORD" && -n "$SIGN_KEY_ALIAS" && -n "$SIGN_KEY_PASSWORD" ]]; then
            echo "Using configured repository signing key"
            printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
            SIGNING_MODE="persistent"
          else
            echo "Signing Secrets are not configured; generating an ephemeral test keystore"
            SIGN_STORE_PASSWORD="test-${GITHUB_RUN_ID}-${RANDOM}"
            SIGN_KEY_PASSWORD="$SIGN_STORE_PASSWORD"
            SIGN_KEY_ALIAS="tin-test"
            keytool -genkeypair \
              -keystore android/release-keystore.jks \
              -storepass "$SIGN_STORE_PASSWORD" \
              -keypass "$SIGN_KEY_PASSWORD" \
              -alias "$SIGN_KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=TIN Test, OU=Android, O=nnn669, C=CN" \
              -noprompt
            SIGNING_MODE="ephemeral-test"
          fi
          test -s android/release-keystore.jks
          echo "SIGNING_MODE=${SIGNING_MODE}" >> "$GITHUB_ENV"
          cat > android/key.properties <<EOF
          storeFile=../release-keystore.jks
          storePassword=${SIGN_STORE_PASSWORD}
          keyAlias=${SIGN_KEY_ALIAS}
          keyPassword=${SIGN_KEY_PASSWORD}
          EOF
          chmod 600 android/release-keystore.jks android/key.properties

      - name: Build signed release APK
        env:
          BUILD_NAME_OVERRIDE: ${{ inputs.build_name }}
        run: |
          set -euo pipefail
          if [[ -n "${BUILD_NAME_OVERRIDE}" ]]; then
            flutter build apk --release --build-name "${BUILD_NAME_OVERRIDE}" --build-number "${VERSION_CODE}"
          else
            flutter build apk --release --build-number "${VERSION_CODE}"
          fi

      - name: Verify APK signature and version
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer" manifest version-code "$APK" | grep -qx "$VERSION_CODE"
          sha256sum "$APK"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TIN-android-test-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="test-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          if [[ "$SIGNING_MODE" == "persistent" ]]; then
            SIGNING_NOTE="签名模式：仓库持久签名，可覆盖同证书旧版本。"
          else
            SIGNING_NOTE="签名模式：临时测试签名；未配置持久签名 Secrets 时，后续构建不能覆盖本包。"
          fi
          gh release create "$TAG" build/app/outputs/flutter-apk/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "TIN Android 测试包 ${GITHUB_RUN_NUMBER}" \
            --notes "自动构建的 Android signed release APK，仅用于测试。${SIGNING_NOTE}

versionCode: ${VERSION_CODE}
Commit: ${GITHUB_SHA}"