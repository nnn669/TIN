name: Android Test Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_name:
        description: Optional version name override
        required: false
        type: string
      release_type:
        description: Release channel
        required: true
        default: test
        type: choice
        options:
          - test
          - formal

permissions:
  contents: write

concurrency:
  group: android-test-release-${{ github.event_name }}-${{ inputs.release_type || 'test' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.1

jobs:
  pull-request-check:
    name: Flutter check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze changed streaming and provider code
        run: flutter analyze lib/core/services/network/dio_http_client.dart lib/core/services/api/provider_request_headers.dart lib/core/services/chat/chat_service.dart lib/core/services/chat/streaming_message_persistence.dart lib/features/home/controllers/streaming_content_notifier.dart lib/features/provider/widgets/add_provider_sheet.dart test/sse_buffer_flush_test.dart test/provider_request_headers_test.dart test/core/services/chat/streaming_message_persistence_test.dart test/features/home/controllers/streaming_content_notifier_test.dart
      - name: Run all tests with coverage
        run: flutter test --coverage
      - name: Check coverage threshold
        run: |
          COVERAGE=$(grep -oP '\d+\.\d+(?=%)' coverage/lcov.info | head -1)
          if [ -z "$COVERAGE" ]; then
            COVERAGE=0
          fi
          echo 'Coverage:' $COVERAGE '%'
          python3 -c "import sys; sys.exit(0 if float('$COVERAGE') >= 60.0 else 1)" || (echo 'Coverage below 60% threshold' && exit 1)

  android-release:
    name: Signed Android arm64 release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Calculate Android version code
        shell: bash
        run: |
          set -euo pipefail
          base_version_code=$(awk -F+ '/^version:/ {print $2; exit}' pubspec.yaml | tr -d '[:space:]')
          test -n "$base_version_code"
          test "$base_version_code" -eq "$((base_version_code + 0))"
          version_code=$((base_version_code + GITHUB_RUN_NUMBER))
          test "$version_code" -gt "$base_version_code"
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
      - name: Prepare release keystore
        shell: bash
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          SIGN_STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$SIGN_KEYSTORE_BASE64" && -n "$SIGN_STORE_PASSWORD" && -n "$SIGN_KEY_ALIAS" && -n "$SIGN_KEY_PASSWORD" ]]; then
            printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
            echo "SIGNING_MODE=persistent" >> "$GITHUB_ENV"
          else
            sign_password="test-${GITHUB_RUN_ID}-${RANDOM}"
            keytool -genkeypair -keystore android/release-keystore.jks -storepass "$sign_password" -keypass "$sign_password" -alias tin-test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=TIN Test, OU=Android, O=nnn669, C=CN" -noprompt
            SIGN_STORE_PASSWORD="$sign_password"
            SIGN_KEY_PASSWORD="$sign_password"
            SIGN_KEY_ALIAS="tin-test"
            echo "SIGNING_MODE=ephemeral-test" >> "$GITHUB_ENV"
          fi
          printf 'storeFile=../release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$SIGN_STORE_PASSWORD" "$SIGN_KEY_ALIAS" "$SIGN_KEY_PASSWORD" > android/key.properties
      - name: Build signed arm64 APK only
        env:
          BUILD_NAME_OVERRIDE: ${{ inputs.build_name }}
        run: |
          set -euo pipefail
          args=(--release --split-per-abi --target-platform android-arm64 --build-number "$VERSION_CODE")
          if [[ -n "$BUILD_NAME_OVERRIDE" ]]; then args+=(--build-name "$BUILD_NAME_OVERRIDE"); fi
          flutter build apk "${args[@]}"
      - name: Verify arm64 APK signature and version
        shell: bash
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$apksigner"
          test -x "$apkanalyzer"
          test ! -e build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test ! -e build/app/outputs/flutter-apk/app-x86_64-release.apk
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$apk"
          test "$(stat -c '%s' "$apk")" -lt "$((60 * 1024 * 1024))"
          "$apksigner" verify --verbose --print-certs "$apk"
          "$apkanalyzer" manifest version-code "$apk"
          sha256sum "$apk"
      - name: Upload single arm64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TIN-android-arm64-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NAME_OVERRIDE: ${{ inputs.build_name }}
          RELEASE_TYPE: ${{ inputs.release_type || 'test' }}
        shell: bash
        run: |
          set -euo pipefail
          version_name="$BUILD_NAME_OVERRIDE"
          if [[ -z "$version_name" ]]; then version_name=$(awk -F: '/^version:/ {gsub(/[[:space:]]/, "", $2); split($2, parts, "+"); print parts[1]; exit}' pubspec.yaml); fi
          test -n "$version_name"
          if [[ "$RELEASE_TYPE" == "formal" ]]; then
            tag="v${version_name}"; title="TIN Android ${version_name}"; release_options=()
            notes=$(printf 'TIN Android 正式版，基于提交 %s 构建。\n\n本次仅发布 arm64-v8a 单 APK。\n签名模式：%s\nversionName: %s\nversionCode: %s\nCommit: %s' "$GITHUB_SHA" "$SIGNING_MODE" "$version_name" "$VERSION_CODE" "$GITHUB_SHA")
          else
            tag="test-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"; title="TIN Android 测试包 ${GITHUB_RUN_NUMBER}"; release_options=(--prerelease)
            notes=$(printf '自动构建的 Android arm64-v8a signed APK，仅用于测试。\n\n本次仅发布单 APK。\n签名模式：%s\nversionName: %s\nversionCode: %s\nCommit: %s' "$SIGNING_MODE" "$version_name" "$VERSION_CODE" "$GITHUB_SHA")
          fi
          gh release create "$tag" build/app/outputs/flutter-apk/app-arm64-v8a-release.apk --repo "$GITHUB_REPOSITORY" "${release_options[@]}" --title "$title" --notes "$notes"