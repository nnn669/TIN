name: Android Test Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_name:
        description: Optional version name override
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-test-release-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: 8.14
  BASE_VERSION_CODE: 9023
  DEFAULT_VERSION_NAME: 1.1.23

jobs:
  native-android-check:
    name: Native Android check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          arguments: >-
            -p android
            test
            --no-daemon
      - name: Assemble debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          arguments: >-
            -p android
            assembleDebug
            --no-daemon

  android-release:
    name: Signed native Android prerelease
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Calculate Android version
        shell: bash
        run: |
          set -euo pipefail
          version_name="${{ inputs.build_name }}"
          if [[ -z "$version_name" ]]; then version_name="$DEFAULT_VERSION_NAME"; fi
          version_code=$((BASE_VERSION_CODE + GITHUB_RUN_NUMBER))
          test "$version_code" -gt "$BASE_VERSION_CODE"
          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "Building native Android versionName=$version_name versionCode=$version_code"
      - name: Prepare release keystore
        shell: bash
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          SIGN_STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          configured=0
          if [[ -n "$SIGN_KEYSTORE_BASE64" ]]; then configured=$((configured + 1)); fi
          if [[ -n "$SIGN_STORE_PASSWORD" ]]; then configured=$((configured + 1)); fi
          if [[ -n "$SIGN_KEY_ALIAS" ]]; then configured=$((configured + 1)); fi
          if [[ -n "$SIGN_KEY_PASSWORD" ]]; then configured=$((configured + 1)); fi
          if [[ "$configured" -eq 4 ]]; then
            echo "Using configured repository signing key"
            printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
            echo "SIGNING_MODE=persistent" >> "$GITHUB_ENV"
          elif [[ "$configured" -eq 0 ]]; then
            echo "Signing Secrets are not configured; generating an ephemeral test keystore"
            sign_password="test-${GITHUB_RUN_ID}-${RANDOM}"
            keytool -genkeypair -keystore android/release-keystore.jks -storepass "$sign_password" -keypass "$sign_password" -alias tin-test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=TIN Test, OU=Android, O=nnn669, C=CN" -noprompt
            SIGN_STORE_PASSWORD="$sign_password"
            SIGN_KEY_PASSWORD="$sign_password"
            SIGN_KEY_ALIAS="tin-test"
            echo "SIGNING_MODE=ephemeral-test" >> "$GITHUB_ENV"
          else
            echo "Android signing Secrets are only partially configured; refusing to create a mismatched build."
            exit 1
          fi
          test -s android/release-keystore.jks
          printf 'storeFile=../release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$SIGN_STORE_PASSWORD" "$SIGN_KEY_ALIAS" "$SIGN_KEY_PASSWORD" > android/key.properties
          chmod 600 android/release-keystore.jks android/key.properties
      - name: Build signed split APKs
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          arguments: >-
            -p android
            assembleRelease
            -PtinVersionName=${{ env.VERSION_NAME }}
            -PtinVersionCode=${{ env.VERSION_CODE }}
            --no-daemon
      - name: Verify APK signatures, versions and package names
        shell: bash
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$apksigner"
          test -x "$apkanalyzer"
          test ! -e android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          found=0
          max_bytes=$((60 * 1024 * 1024))
          for apk in android/app/build/outputs/apk/release/app-*-release.apk; do
            test -s "$apk"
            test "$(stat -c '%s' "$apk")" -lt "$max_bytes"
            "$apksigner" verify --verbose --print-certs "$apk"
            actual_package=$("$apkanalyzer" manifest application-id "$apk" | tr -d '[:space:]')
            actual_version_code=$("$apkanalyzer" manifest version-code "$apk" | tr -d '[:space:]')
            actual_version_name=$("$apkanalyzer" manifest version-name "$apk" | tr -d '[:space:]')
            test "$actual_package" = "com.psyche.tin"
            test "$actual_version_code" = "$VERSION_CODE"
            test "$actual_version_name" = "$VERSION_NAME"
            echo "Verified $(basename "$apk"): package=$actual_package versionName=$actual_version_name versionCode=$actual_version_code"
            sha256sum "$apk"
            found=1
          done
          test "$found" -eq 1
      - name: Upload split APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TIN-native-android-test-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-*-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="native-test-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          if [[ "$SIGNING_MODE" == "persistent" ]]; then
            signing_note='签名模式：仓库持久签名，可覆盖同证书旧版本。'
          else
            signing_note='签名模式：临时测试签名；未配置持久签名 Secrets 时，后续构建不能覆盖本包。'
          fi
          notes=$(printf 'TIN 原生 Android Kotlin + Jetpack Compose 迁移阶段测试包。%s\n\n当前为迁移基础版本，聊天模型 Provider、MCP 和备份功能尚未迁移完成。\n仅提供 64 位包体：arm64-v8a 适合大多数 Android 手机，优先下载该包。\nversionName: %s\nversionCode: %s\nCommit: %s' "$signing_note" "$VERSION_NAME" "$VERSION_CODE" "$GITHUB_SHA")
          gh release create "$tag" android/app/build/outputs/apk/release/app-arm64-v8a-release.apk android/app/build/outputs/apk/release/app-x86_64-release.apk --repo "$GITHUB_REPOSITORY" --prerelease --title "TIN 原生 Android 迁移测试包 ${GITHUB_RUN_NUMBER}" --notes "$notes"