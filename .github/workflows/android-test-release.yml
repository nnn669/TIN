name: Android Test Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_name:
        description: Optional version name override
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-test-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.1

jobs:
  pull-request-check:
    name: Flutter check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run targeted regression tests
        run: flutter test test/features/chat/widgets/reasoning_budget_sheet_test.dart test/kelivo_github_mcp_server_test.dart

  android-release:
    name: Signed Android prerelease
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Calculate Android version code
        shell: bash
        run: |
          set -euo pipefail
          base_version_code=$(awk -F+ '/^version:/ {print $2; exit}' pubspec.yaml | tr -d '[:space:]')
          test -n "$base_version_code"
          test "$base_version_code" -eq "$((base_version_code + 0))"
          version_code=$((base_version_code + GITHUB_RUN_NUMBER))
          test "$version_code" -gt "$base_version_code"
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "Building versionCode=$version_code from base=$base_version_code and run=$GITHUB_RUN_NUMBER"

      - name: Prepare release keystore
        shell: bash
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          SIGN_STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$SIGN_KEYSTORE_BASE64" && -n "$SIGN_STORE_PASSWORD" && -n "$SIGN_KEY_ALIAS" && -n "$SIGN_KEY_PASSWORD" ]]; then
            echo "Using configured repository signing key"
            printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
            echo "SIGNING_MODE=persistent" >> "$GITHUB_ENV"
          else
            echo "Signing Secrets are not configured; generating an ephemeral test keystore"
            sign_password="test-${GITHUB_RUN_ID}-${RANDOM}"
            keytool -genkeypair \
              -keystore android/release-keystore.jks \
              -storepass "$sign_password" \
              -keypass "$sign_password" \
              -alias tin-test \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=TIN Test, OU=Android, O=nnn669, C=CN" \
              -noprompt
            SIGN_STORE_PASSWORD="$sign_password"
            SIGN_KEY_PASSWORD="$sign_password"
            SIGN_KEY_ALIAS="tin-test"
            echo "SIGNING_MODE=ephemeral-test" >> "$GITHUB_ENV"
          fi
          test -s android/release-keystore.jks
          printf 'storeFile=../release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$SIGN_STORE_PASSWORD" "$SIGN_KEY_ALIAS" "$SIGN_KEY_PASSWORD" > android/key.properties
          chmod 600 android/release-keystore.jks android/key.properties

      - name: Build signed release APK
        env:
          BUILD_NAME_OVERRIDE: ${{ inputs.build_name }}
        run: |
          set -euo pipefail
          if [[ -n "$BUILD_NAME_OVERRIDE" ]]; then
            flutter build apk --release --build-name "$BUILD_NAME_OVERRIDE" --build-number "$VERSION_CODE"
          else
            flutter build apk --release --build-number "$VERSION_CODE"
          fi

      - name: Verify APK signature and version
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$apkanalyzer"
          test "$("$apkanalyzer" manifest version-code "$apk")" = "$VERSION_CODE"
          sha256sum "$apk"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TIN-android-test-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="test-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          if [[ "$SIGNING_MODE" == "persistent" ]]; then
            signing_note='签名模式：仓库持久签名，可覆盖同证书旧版本。'
          else
            signing_note='签名模式：临时测试签名；未配置持久签名 Secrets 时，后续构建不能覆盖本包。'
          fi
          notes=$(printf '自动构建的 Android signed release APK，仅用于测试。%s\n\nversionCode: %s\nCommit: %s' "$signing_note" "$VERSION_CODE" "$GITHUB_SHA")
          gh release create "$tag" build/app/outputs/flutter-apk/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "TIN Android 测试包 ${GITHUB_RUN_NUMBER}" \
            --notes "$notes"