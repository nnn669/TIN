name: Android Test Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_name:
        description: Optional version name override
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-test-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.1

jobs:
  pull-request-check:
    name: Flutter check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze changed API identity, chat persistence and provider UI code
        run: flutter analyze lib/core/services/api/provider_request_headers.dart lib/core/services/chat/chat_service.dart lib/core/services/chat/streaming_message_persistence.dart lib/features/provider/widgets/add_provider_sheet.dart test/provider_request_headers_test.dart test/core/services/chat/streaming_message_persistence_test.dart
      - name: Run targeted regression tests
        run: flutter test test/features/chat/widgets/reasoning_budget_sheet_test.dart test/kelivo_github_mcp_server_test.dart test/sse_buffer_flush_test.dart test/mcp_lifecycle_reconnect_test.dart test/provider_request_headers_test.dart test/core/services/chat/chat_service_temporary_conversation_test.dart test/core/services/chat/streaming_message_persistence_test.dart

  android-release:
    name: Signed Android prerelease
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Calculate Android version code
        shell: bash
        run: |
          set -euo pipefail
          base_version_code=$(awk -F+ '/^version:/ {print $2; exit}' pubspec.yaml | tr -d '[:space:]')
          test -n "$base_version_code"
          test "$base_version_code" -eq "$((base_version_code + 0))"
          version_code=$((base_version_code + GITHUB_RUN_NUMBER))
          test "$version_code" -gt "$base_version_code"
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "Building versionCode=$version_code from base=$base_version_code and run=$GITHUB_RUN_NUMBER"
      - name: Prepare release keystore
        shell: bash
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          SIGN_STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$SIGN_KEYSTORE_BASE64" && -n "$SIGN_STORE_PASSWORD" && -n "$SIGN_KEY_ALIAS" && -n "$SIGN_KEY_PASSWORD" ]]; then
            echo "Using configured repository signing key"
            printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
            echo "SIGNING_MODE=persistent" >> "$GITHUB_ENV"
          else
            echo "Signing Secrets are not configured; generating an ephemeral test keystore"
            sign_password="test-${GITHUB_RUN_ID}-${RANDOM}"
            keytool -genkeypair -keystore android/release-keystore.jks -storepass "$sign_password" -keypass "$sign_password" -alias tin-test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=TIN Test, OU=Android, O=nnn669, C=CN" -noprompt
            SIGN_STORE_PASSWORD="$sign_password"
            SIGN_KEY_PASSWORD="$sign_password"
            SIGN_KEY_ALIAS="tin-test"
            echo "SIGNING_MODE=ephemeral-test" >> "$GITHUB_ENV"
          fi
          test -s android/release-keystore.jks
          printf 'storeFile=../release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$SIGN_STORE_PASSWORD" "$SIGN_KEY_ALIAS" "$SIGN_KEY_PASSWORD" > android/key.properties
          chmod 600 android/release-keystore.jks android/key.properties
      - name: Build signed split APKs
        env:
          BUILD_NAME_OVERRIDE: ${{ inputs.build_name }}
        run: |
          set -euo pipefail
          # TIN 只发布 64 位包体，因此不构建 armeabi-v7a。
          args=(--release --split-per-abi --target-platform android-arm64,android-x64 --build-number "$VERSION_CODE")
          if [[ -n "$BUILD_NAME_OVERRIDE" ]]; then args+=(--build-name "$BUILD_NAME_OVERRIDE"); fi
          flutter build apk "${args[@]}"
      - name: Verify APK signatures and versions
        shell: bash
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$apksigner"
          test -x "$apkanalyzer"
          # 32 位包体不允许出现在发布产物中。
          test ! -e build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          found=0
          max_bytes=$((60 * 1024 * 1024))
          for apk in build/app/outputs/flutter-apk/app-*.apk; do
            test -s "$apk"
            test "$(stat -c '%s' "$apk")" -lt "$max_bytes"
            "$apksigner" verify --verbose --print-certs "$apk"
            actual_version_code=$("$apkanalyzer" manifest version-code "$apk" | tr -d '[:space:]')
            if [[ "$actual_version_code" != "$VERSION_CODE" ]]; then
              # Flutter split APKs add an ABI offset (ABI code * 1000).
              version_code_delta=$((actual_version_code - VERSION_CODE))
              test "$version_code_delta" -gt 0
              test "$((version_code_delta % 1000))" -eq 0
              abi_code=$((version_code_delta / 1000))
              test "$abi_code" -ge 1
              test "$abi_code" -le 4
            fi
            echo "Verified $(basename "$apk"): versionCode=$actual_version_code"
            sha256sum "$apk"
            found=1
          done
          test "$found" -eq 1
      - name: Upload split APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TIN-android-test-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="test-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          if [[ "$SIGNING_MODE" == "persistent" ]]; then
            signing_note='签名模式：仓库持久签名，可覆盖同证书旧版本。'
          else
            signing_note='签名模式：临时测试签名；未配置持久签名 Secrets 时，后续构建不能覆盖本包。'
          fi
          notes=$(printf '自动构建的 Android signed split APK，仅用于测试。%s\n\n仅提供 64 位包体：arm64-v8a 适合大多数 Android 手机，优先下载该包。\nversionCode: %s\nCommit: %s' "$signing_note" "$VERSION_CODE" "$GITHUB_SHA")
          gh release create "$tag" build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-x86_64-release.apk --repo "$GITHUB_REPOSITORY" --prerelease --title "TIN Android 测试包 ${GITHUB_RUN_NUMBER}" --notes "$notes"