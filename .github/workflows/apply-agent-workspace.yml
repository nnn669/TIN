name: Apply Agent Workspace Surface

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - name: Apply minimal message-list integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/home/widgets/message_list_view.dart')
          s = p.read_text()
          import_line = "import 'model_icon.dart';"
          if "agent_workspace_message.dart" not in s:
              s = s.replace(import_line, import_line + "\nimport 'agent_workspace_message.dart';", 1)
          old = "    if (!isSpotlight) return messageColumn;"
          new = """    final workspaceMessage = AgentWorkspaceMessage(
          role: message.role,
          isLast: index == widget.messages.length - 1,
          child: messageColumn,
        );
        if (!isSpotlight) return workspaceMessage;"""
          if old in s:
              s = s.replace(old, new, 1)
          old_child = "      child: messageColumn,\n    );\n  }\n\n  int _latestAssistantMessageIndex()"
          new_child = "      child: workspaceMessage,\n    );\n  }\n\n  int _latestAssistantMessageIndex()"
          if old_child in s:
              s = s.replace(old_child, new_child, 1)
          p.write_text(s)
          PY
          dart format lib/features/home/widgets/message_list_view.dart lib/features/home/widgets/agent_workspace_message.dart
          flutter analyze lib/features/home/widgets/message_list_view.dart lib/features/home/widgets/agent_workspace_message.dart
          flutter test test/features/chat/widgets/chat_message_widget_background_test.dart
          git config user.name nnn669
          git config user.email 510875510@qq.com
          git add lib/features/home/widgets/message_list_view.dart lib/features/home/widgets/agent_workspace_message.dart
          git commit -m 'feat(chat): render all messages in agent workspace'
          git rm .github/workflows/apply-agent-workspace.yml
          git commit -m 'chore: remove one-time agent workspace patch workflow'
          git push origin main