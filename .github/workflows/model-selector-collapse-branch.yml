  }

'''
              once(
                  '  Widget _favoritesHeader(BuildContext context, String title) {\n',
                  desktop_header_widget + '  Widget _favoritesHeader(BuildContext context, String title) {\n',
                  'desktop group header widget',
              )

          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate source markers
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          source = Path('lib/features/model/widgets/model_select_sheet.dart').read_text(encoding='utf-8')
          required = [
              'class _ProviderGroupHeaderRow extends _ListRow',
              'toggleGroupCollapsed(row.groupKey)',
              'settings.isGroupCollapsed(groupKey)',
              '_headerIndexMap[groupKey]',
              'showModelDetailSheet(',
              'ProviderBalanceBadge(',
          ]
          for marker in required:
              assert marker in source, marker
          assert source.count('class _ProviderGroupHeaderRow extends _ListRow') == 1
          assert source.count('toggleGroupCollapsed(row.groupKey)') == 2
          assert source.count('Widget _providerGroupHeader(') == 2
          assert source.count('groupKeyFor(String providerKey)') == 2
          assert source.count('targetIndex ??= _headerIndexMap[pk] ?? _headerIndexMap[groupKey];') == 2
          assert source.count('onLongPress: () async') >= 2
          assert source.count('\n') > 1800
          print('model selector collapse source validation passed')
          PY
          git diff --check

      - name: Commit patched source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/model/widgets/model_select_sheet.dart
          git rm --ignore-unmatch .github/workflows/model-selector-collapse-branch.yml
          if git diff --cached --quiet; then
            echo 'No branch patch changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add collapsible model selector provider groups'
          git push origin HEAD:fix/model-selector-collapsible-groups
