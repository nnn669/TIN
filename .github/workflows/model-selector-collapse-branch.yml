name: Model selector collapse source patch

on:
  push:
    branches:
      - fix/model-selector-collapsible-groups

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/model-selector-collapsible-groups
          fetch-depth: 0

      - name: Apply model selector source patch
        run: python3 tools/apply_model_selector_collapse.py

      - name: Validate patched source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('lib/features/model/widgets/model_select_sheet.dart').read_text(encoding='utf-8')
          required = [
              'class _ProviderGroupHeaderRow extends _ListRow',
              'toggleGroupCollapsed(row.groupKey)',
              'settings.isGroupCollapsed(groupKey)',
              '_headerIndexMap[groupKey]',
              'showModelDetailSheet(',
              'ProviderBalanceBadge(',
          ]
          for marker in required:
              assert marker in s, marker
          assert s.count('class _ProviderGroupHeaderRow extends _ListRow') == 1
          assert s.count('toggleGroupCollapsed(row.groupKey)') == 2
          assert s.count('Widget _providerGroupHeader(') == 2
          assert s.count('groupKeyFor(String providerKey)') == 2
          assert s.count('targetIndex ??= _headerIndexMap[pk] ?? _headerIndexMap[groupKey];') == 2
          assert s.count('onLongPress: () async') >= 2
          assert s.count('\n') > 1800
          print('model selector collapse source validation passed')
          PY
          git diff --check

      - name: Commit source patch and remove patch runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/model/widgets/model_select_sheet.dart
          git rm --ignore-unmatch tools/apply_model_selector_collapse.py .github/workflows/model-selector-collapse-branch.yml
          if git diff --cached --quiet; then
            echo 'No source patch changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add collapsible model selector provider groups [skip patch] [skip ci]'
          git push origin HEAD:fix/model-selector-collapsible-groups
