name: Temporary MCP Continue Repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace invalid callback continue
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('lib/core/providers/mcp_provider.dart')
          text = path.read_text()
          pattern = r"(@kelivo/copilot'\)\s*\{\s*)continue;"
          matches = list(re.finditer(pattern, text))
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one target, found {len(matches)}')
          updated = re.sub(pattern, r'\1return;', text)
          if updated == text:
              raise SystemExit('source was not changed')
          path.write_text(updated)
          PY
          git diff --check
          git diff -- lib/core/providers/mcp_provider.dart
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/providers/mcp_provider.dart
          git commit -m 'fix(mcp): return from import callback for obsolete Copilot entry'
          git push origin HEAD:main