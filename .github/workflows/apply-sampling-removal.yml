name: Apply sampling removal

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/apply_sampling_removal.py

permissions:
  contents: write

concurrency:
  group: apply-sampling-removal
  cancel-in-progress: false

jobs:
  apply:
    name: Remove temperature/topP call sites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 tools/apply_sampling_removal.py
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Patcher produced no changes' >&2
            exit 1
          fi
          git commit -m 'refactor(assistant): drop temperature/topP call sites'
          git push origin HEAD:main
