name: Restore formal Flutter v1.1.21

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore target tree and push rollback commit
        shell: bash
        run: |
          set -euo pipefail
          target="77cc88cb0abb3622bf5949319e9d005f37384677"
          git fetch origin "$target" --no-tags
          git read-tree --reset -u "$target"
          git clean -fdx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "revert: restore formal Flutter v1.1.21 baseline" \
            -m "Restore main to the exact source tree used by formal release v1.1.21, versionCode 9110, Run #95 ($target). Preserve repository history without force-pushing." \
            -m "Verification target: Flutter Android signed release baseline."
          git push origin HEAD:main