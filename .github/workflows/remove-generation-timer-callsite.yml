name: One-time remove generation timer call site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove orphaned GenerationTimerBadge call site
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          target = Path('lib/features/chat/widgets/chat_message_widget.dart')
          source = target.read_text(encoding='utf-8')

          old = """                          const SizedBox(width: 6),
                          GenerationTimerBadge(
                            isStreaming: widget.message.isStreaming,
                            startTime: widget.message.timestamp,
                            durationMs: widget.message.durationMs,
                          ),
"""

          occurrences = source.count(old)
          if occurrences != 1:
              raise SystemExit(
                  f'expected exactly one call site, found {occurrences}'
              )

          source = source.replace(old, '', 1)

          if 'GenerationTimerBadge' in source:
              raise SystemExit('GenerationTimerBadge still referenced')

          target.write_text(source, encoding='utf-8')
          print('removed orphaned GenerationTimerBadge call site')
          PY

      - name: Self-delete workflow
        run: rm -f .github/workflows/remove-generation-timer-callsite.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(chat): drop orphaned GenerationTimerBadge call site

          commit 3efb5d9 removed generation_timer_badge.dart and its import but
          left the widget call site, breaking the release build with
          "The method GenerationTimerBadge is not defined".'
          git push origin main