name: tin
description: "An Android LLM chat client."
publish_to: 'none'

version: 1.1.41+9031

environment:
  sdk: ^3.12.1
  flutter: ">=3.44.1"

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.2.0
  bitsdojo_window: ^0.1.6
  window_manager: ^0.5.1
  screen_retriever: ^0.2.0
  tray_manager:
    path: ./dependencies/tray_manager/packages/tray_manager
  desktop_drop: ^0.7.1
  hotkey_manager: ^0.2.3
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.5
  dynamic_color: ^1.8.1
  lucide_icons_flutter: ^3.1.13
  shared_preferences: ^2.2.3
  image_picker: 1.1.2
  image_cropper: ^12.2.1
  flutter_svg: ^2.2.1
  http: ^1.5.0
  crypto: ^3.0.3
  dio: ^5.9.0
  ddgs: ^0.3.2
  socks5_proxy: ^2.1.1
  jose: ^0.3.4
  reorderable_grid_view: ^2.2.8
  flutter_slidable: ^3.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  url_launcher: ^6.3.2
  package_info_plus: ^8.3.1
  gpt_markdown:
    path: ./dependencies/gpt_markdown
  uuid: ^4.5.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.4
  file_picker: ^10.3.10
  archive: ^4.0.9
  xml: ^6.5.0
  yaml: ^3.1.3
  open_filex: ^4.5.0
  easy_image_viewer: ^1.4.6
  share_plus: ^11.1.0
  pretty_qr_code: ^3.5.0
  mobile_scanner: ^7.0.1
  mcp_client:
    path: ./dependencies/mcp_client
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  syncfusion_flutter_core: ^31.2.5
  syncfusion_flutter_sliders: ^31.2.5
  syncfusion_flutter_pdf: ^31.2.5
  audioplayers: ^6.5.1
  html: ^0.15.6
  html2md: ^1.2.10
  http_parser: ^4.1.2
  animations: ^2.0.11
  flutter_animate: ^4.5.2
  webview_flutter: ^4.13.1
  webview_flutter_wkwebview: ^3.25.1
  webview_windows: ^0.4.0
  flutter_math_fork: ^0.7.4
  scrollable_positioned_list: ^0.3.8
  scrollview_observer: ^1.26.0
  image_gallery_saver_plus: ^4.0.1
  haptic_feedback: ^0.6.4+3
  system_fonts: ^1.0.1
  google_fonts: ^6.3.2
  super_clipboard: ^0.9.1
  permission_handler: ^12.0.3
  flutter_tts:
    path: ./dependencies/flutter_tts
  flutter_background: ^1.3.0+1
  flutter_local_notifications: ^17.2.3
  image: ^4.8.0
  math_expressions: ^2.6.2
  cupertino_icons: ^1.0.8
  restart_app: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_lints: ^5.0.0

dependency_overrides:
  permission_handler_windows:
    path: ./dependencies/flutter-permission-handler/permission_handler_windows

hooks:
  user_defines:
    sqlite3:
      source: system

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/app_icon.png
    - assets/app_icon.ico
    - assets/icon_mac.png
    - assets/mermaid.min.js
    - assets/html/mark.html

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon_foreground.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/app_icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  android: true
  color: "#FFFFFF"
  color_dark: "#000000"
  image: assets/start.png
  image_dark: assets/start.png
  ios_content_mode: center
  android_12:
    color: "#FFFFFF"
    color_dark: "#000000"
    image: assets/start.png
    image_dark: assets/start.png